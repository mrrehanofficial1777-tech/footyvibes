<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Eid Mubarak ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
}
body{
  min-height:100vh;
  min-height:-webkit-fill-available;
}

/* ═══════════════════════════════════════════
   CANVAS LAYERS
═══════════════════════════════════════════ */
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#c0{z-index:1}   /* deep sky bg */
#c1{z-index:2}   /* stars + nebula */
#c2{z-index:3}   /* mosque + geo */
#c3{z-index:4}   /* moon */
#c4{z-index:5}   /* particles + lanterns */
#c5{z-index:6;pointer-events:none}  /* fx: shoots, fireworks */

/* ═══════════════════════════════════════════
   LANTERNS  (CSS animated, HTML elements)
═══════════════════════════════════════════ */
#lantern-row{
  position:fixed;top:0;left:0;right:0;
  z-index:7;pointer-events:none;
  display:flex;justify-content:space-around;
  padding:0 2vw;
  opacity:0;
  transition:opacity 2s ease;
}
#lantern-row.show{opacity:1}

.ln-wrap{
  display:flex;flex-direction:column;align-items:center;
  transform-origin:top center;
}
.ln-string{
  width:1.5px;
  height:clamp(40px,7vh,80px);
  background:linear-gradient(to bottom,rgba(212,175,55,.8),rgba(212,175,55,.3));
}
.ln-body{
  border-radius:44% 44% 55% 55%/36% 36% 64% 64%;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.ln-body::before{
  content:'';position:absolute;
  top:-14%;left:50%;transform:translateX(-50%);
  width:28%;height:18%;
  border-radius:4px 4px 0 0;
  background:rgba(212,175,55,.9);
}
.ln-body::after{
  content:'';position:absolute;
  bottom:-14%;left:50%;transform:translateX(-50%);
  width:18%;height:18%;border-radius:50%;
  background:rgba(212,175,55,.9);
}
.ln-shine{
  position:absolute;
  top:15%;left:20%;
  width:35%;height:55%;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  filter:blur(3px);
}
.ln-glow{
  position:absolute;
  border-radius:50%;
  filter:blur(16px);
  z-index:-1;
  animation:lnGlowPulse 2s ease-in-out infinite alternate;
}
@keyframes lnGlowPulse{
  from{opacity:.55;transform:scale(.9)}
  to{opacity:.9;transform:scale(1.1)}
}

/* sway */
.sw1{animation:sway1 3.1s ease-in-out infinite}
.sw2{animation:sway2 3.8s ease-in-out infinite}
.sw3{animation:sway3 2.9s ease-in-out infinite}
.sw4{animation:sway4 4.2s ease-in-out infinite}
.sw5{animation:sway5 3.5s ease-in-out infinite}
.sw6{animation:sway6 3.3s ease-in-out infinite}
@keyframes sway1{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes sway2{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-10deg)}}
@keyframes sway3{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(11deg)}}
@keyframes sway4{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-8deg)}}
@keyframes sway5{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(7deg)}}
@keyframes sway6{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-9deg)}}

/* ═══════════════════════════════════════════
   DECORATIVE STRING connecting lanterns
═══════════════════════════════════════════ */
#bunting{
  position:fixed;top:0;left:0;right:0;z-index:7;
  height:clamp(50px,9vh,90px);pointer-events:none;
  opacity:0;transition:opacity 2.5s ease .5s;
}
#bunting.show{opacity:1}

/* ═══════════════════════════════════════════
   STAGE  (text layer)
═══════════════════════════════════════════ */
#stage{
  position:fixed;inset:0;z-index:8;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  pointer-events:none;
  padding-bottom:max(7vh,env(safe-area-inset-bottom,0px) + 6vh);
}

/* Arabic */
#ar{
  font-family:'Amiri',serif;
  font-weight:700;
  font-size:clamp(3rem,11.5vw,7.5rem);
  line-height:1;letter-spacing:.04em;
  text-align:center;
  color:transparent;
  background:linear-gradient(170deg,#fffde0 0%,#ffe472 18%,#d4af37 42%,#fff8b0 65%,#c07800 100%);
  -webkit-background-clip:text;background-clip:text;
  opacity:0;transform:translateY(40px) scale(.85);
  will-change:opacity,filter,transform;
  transition:opacity 4s cubic-bezier(.16,1,.3,1),
             filter  4s cubic-bezier(.16,1,.3,1),
             transform 4s cubic-bezier(.16,1,.3,1);
  filter:drop-shadow(0 0 30px rgba(212,175,55,.7))
         drop-shadow(0 5px 18px rgba(0,0,0,.95)) blur(22px);
}
#ar.show{
  opacity:1;transform:translateY(0) scale(1);
  filter:drop-shadow(0 0 45px rgba(212,175,55,.9))
         drop-shadow(0 0 100px rgba(212,175,55,.45))
         drop-shadow(0 6px 24px rgba(0,0,0,1)) blur(0px);
  animation:arFloat 5s ease-in-out 4.2s infinite;
}
@keyframes arFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.005)}
}

/* ornament */
#orn{
  display:flex;align-items:center;gap:16px;
  margin:clamp(10px,2.2vh,20px) 0 clamp(8px,1.8vh,16px);
  opacity:0;transform:scaleX(.4);
  transition:opacity 2.2s ease,transform 2.2s cubic-bezier(.34,1.56,.64,1);
}
#orn.show{opacity:1;transform:scaleX(1)}
.oline{height:1px;width:clamp(44px,9.5vw,130px);
  background:linear-gradient(to right,transparent,rgba(212,175,55,.72),transparent)}
.oline.r{background:linear-gradient(to left,transparent,rgba(212,175,55,.72),transparent)}
.osym{font-size:clamp(.95rem,2.4vw,1.4rem);color:rgba(212,175,55,.9);
  text-shadow:0 0 18px rgba(212,175,55,.8);white-space:nowrap;
  animation:osymPulse 3s ease-in-out infinite 2s}
@keyframes osymPulse{0%,100%{text-shadow:0 0 18px rgba(212,175,55,.8)}
  50%{text-shadow:0 0 40px rgba(212,175,55,1),0 0 80px rgba(212,175,55,.5)}}

/* English */
#en{
  font-family:'Cinzel Decorative',cursive;
  font-weight:700;
  font-size:clamp(1rem,4.5vw,3.2rem);
  letter-spacing:.28em;text-align:center;
  color:transparent;
  background:linear-gradient(160deg,#fff9e6 0%,#ffe98a 24%,#d4af37 48%,#fffde7 70%,#9a7808 100%);
  -webkit-background-clip:text;background-clip:text;
  opacity:0;transform:translateY(22px) scale(.9);
  will-change:opacity,filter,transform;
  transition:opacity 3.4s cubic-bezier(.16,1,.3,1) .2s,
             filter  3.4s cubic-bezier(.16,1,.3,1) .2s,
             transform 3.4s cubic-bezier(.16,1,.3,1) .2s;
  filter:drop-shadow(0 0 20px rgba(212,175,55,.6)) blur(18px);
  padding-right:.28em;max-width:96vw;overflow:hidden;
}
#en.show{
  opacity:1;transform:translateY(0) scale(1);
  filter:drop-shadow(0 0 35px rgba(212,175,55,.85))
         drop-shadow(0 0 88px rgba(212,175,55,.38))
         drop-shadow(0 5px 22px rgba(0,0,0,1)) blur(0px);
  animation:enShimmer 6s linear 3.8s infinite;
}
@keyframes enShimmer{
  0%,100%{filter:drop-shadow(0 0 35px rgba(212,175,55,.85)) drop-shadow(0 0 88px rgba(212,175,55,.38)) drop-shadow(0 5px 22px rgba(0,0,0,1)) blur(0px)}
  50%{filter:drop-shadow(0 0 55px rgba(255,220,80,1)) drop-shadow(0 0 120px rgba(212,175,55,.6)) drop-shadow(0 5px 22px rgba(0,0,0,1)) blur(0px)}
}

/* sub tagline */
#sub{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-weight:300;
  font-size:clamp(.75rem,2.2vw,1.08rem);
  letter-spacing:.2em;text-align:center;
  color:rgba(255,240,180,0);
  margin-top:clamp(9px,1.8vh,17px);
  padding:0 16px;max-width:90vw;
  transition:color 3.5s ease;
  text-shadow:0 0 24px rgba(212,175,55,.45);
}
#sub.show{color:rgba(255,240,180,.55)}

/* urdu blessing */
#ur{
  font-family:'Amiri',serif;
  font-size:clamp(.85rem,2.5vw,1.2rem);
  color:rgba(255,230,140,0);
  margin-top:clamp(6px,1.2vh,12px);
  letter-spacing:.06em;
  transition:color 3.5s ease .5s;
  text-shadow:0 0 20px rgba(212,175,55,.4);
  text-align:center;
}
#ur.show{color:rgba(255,230,140,.4)}

/* ═══════════════════════════════════════════
   BOTTOM HINT
═══════════════════════════════════════════ */
#hint{
  position:fixed;
  bottom:max(20px,env(safe-area-inset-bottom,0px) + 14px);
  left:50%;transform:translateX(-50%);
  z-index:9;pointer-events:none;
  opacity:0;transition:opacity 2.5s ease;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  white-space:nowrap;
}
#hint.show{opacity:1}
.h-text{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(.62rem,.85vw,.78rem);
  letter-spacing:.3em;color:rgba(212,175,55,.4);
}
.dot-row{display:flex;gap:8px;align-items:center}
.dp{width:3px;height:3px;border-radius:50%;background:rgba(212,175,55,.5);
  animation:dpulse 2.6s ease-in-out infinite}
.dp:nth-child(2){animation-delay:.5s}
.dp:nth-child(3){animation-delay:1s}
@keyframes dpulse{0%,100%{opacity:.22;transform:scale(1)}50%{opacity:.95;transform:scale(2)}}

/* ═══════════════════════════════════════════
   TAP RIPPLE
═══════════════════════════════════════════ */
.ripple{
  position:fixed;border-radius:50%;pointer-events:none;z-index:10;
  border:1px solid rgba(212,175,55,.55);
  transform:translate(-50%,-50%) scale(0);
  animation:ripOut 1.3s cubic-bezier(.22,1,.36,1) forwards;
}
.ripple2{animation-delay:.15s;border-color:rgba(212,175,55,.3)}
@keyframes ripOut{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.8}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}

/* ═══════════════════════════════════════════
   SCREEN FLASH (on celebration)
═══════════════════════════════════════════ */
#flash{
  position:fixed;inset:0;z-index:20;
  background:rgba(255,220,80,.0);pointer-events:none;
  transition:background .08s;
}
#flash.pop{background:rgba(255,220,80,.18)}
</style>
</head>
<body>

<!-- Canvas stack -->
<canvas id="c0"></canvas>
<canvas id="c1"></canvas>
<canvas id="c2"></canvas>
<canvas id="c3"></canvas>
<canvas id="c4"></canvas>
<canvas id="c5"></canvas>

<!-- Lanterns row -->
<svg id="bunting" viewBox="0 0 1000 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,10 Q125,70 250,20 Q375,70 500,15 Q625,70 750,20 Q875,70 1000,10"
    fill="none" stroke="rgba(212,175,55,.45)" stroke-width="1.2"/>
</svg>

<div id="lantern-row"></div>

<!-- Text stage -->
<div id="stage">
  <div id="ar">عيد مبارك</div>
  <div id="orn">
    <div class="oline"></div>
    <span class="osym">✦ ☪ ✦</span>
    <div class="oline r"></div>
  </div>
  <div id="en">EID MUBARAK</div>
  <div id="sub">May peace, joy &amp; blessings fill your world</div>
  <div id="ur">خوشیاں اور برکتیں آپ کے ساتھ رہیں</div>
</div>

<div id="hint">
  <div class="h-text">✦ &nbsp; A L W A Y S &nbsp; B L E S S E D &nbsp; ✦</div>
  <div class="dot-row">
    <div class="dp"></div><div class="dp"></div><div class="dp"></div>
  </div>
</div>

<div id="flash"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════
   DEVICE
═══════════════════════════════════════════ */
const MOB = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||innerWidth<768;
const LOW = MOB && navigator.hardwareConcurrency <= 4;

/* ═══════════════════════════════════════════
   CANVAS FACTORY
═══════════════════════════════════════════ */
function mkC(id, cap=2){
  const el=document.getElementById(id), ctx=el.getContext('2d');
  let W,H,dpr;
  const resize=()=>{
    dpr=Math.min(devicePixelRatio||1, MOB?1.8:cap);
    W=innerWidth; H=innerHeight;
    el.width=Math.round(W*dpr); el.height=Math.round(H*dpr);
    el.style.width=W+'px'; el.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  resize();
  addEventListener('resize',resize);
  addEventListener('orientationchange',()=>setTimeout(resize,300));
  return{el,ctx,get W(){return W},get H(){return H}};
}
const C0=mkC('c0',1.5); // bg
const C1=mkC('c1',1.5); // stars
const C2=mkC('c2',1.5); // mosque/geo
const C3=mkC('c3',2);   // moon (high res)
const C4=mkC('c4',1.5); // particles
const C5=mkC('c5',1.5); // fx

/* ═══════════════════════════════════════════
   PARALLAX INPUT
═══════════════════════════════════════════ */
let rx=0,ry=0,srx=0,sry=0;
addEventListener('mousemove',e=>{rx=(e.clientX/innerWidth-.5)*2;ry=(e.clientY/innerHeight-.5)*2;});
addEventListener('touchmove',e=>{
  const t=e.touches[0];
  rx=(t.clientX/innerWidth-.5)*2; ry=(t.clientY/innerHeight-.5)*2;
},{passive:true});
if(MOB&&window.DeviceOrientationEvent)
  addEventListener('deviceorientation',e=>{
    if(e.gamma!=null){rx=Math.max(-1,Math.min(1,e.gamma/28));ry=Math.max(-1,Math.min(1,(e.beta-30)/38));}
  },true);

/* ═══════════════════════════════════════════
   TIMELINE
═══════════════════════════════════════════ */
const T={
  glow:.8, aurora:1.4, moon:2.0, moonFull:5.8,
  stars:2.5, geo:3.0, mosque:4.0, part:3.6,
  shoot:5.0, lantern:3.5, bunting:4.0,
  ar:6.0, orn:7.4, en:7.8, sub:9.2, ur:10.0, hint:11.5,
  fireworks:6.2,
};
let t=0, lt=null, aphase=0;

/* ═══════════════════════════════════════════
   LANTERNS  (build DOM)
═══════════════════════════════════════════ */
const LANTERN_DATA=[
  {w:38,h:54,c1:'#ff5500',c2:'#991100',gc:'rgba(255,85,0,',sw:'sw1',delay:'0s'},
  {w:32,h:46,c1:'#ffd700',c2:'#c07800',gc:'rgba(255,200,0,',sw:'sw2',delay:'-.8s'},
  {w:42,h:58,c1:'#cc2200',c2:'#7a0a00',gc:'rgba(200,40,0,',sw:'sw3',delay:'-1.6s'},
  {w:30,h:44,c1:'#22aa55',c2:'#0a5522',gc:'rgba(30,180,80,',sw:'sw4',delay:'-2.2s'},
  {w:36,h:52,c1:'#7722cc',c2:'#3a0a66',gc:'rgba(120,50,220,',sw:'sw5',delay:'-1s'},
  {w:34,h:48,c1:'#ff7700',c2:'#884400',gc:'rgba(255,120,0,',sw:'sw6',delay:'-1.8s'},
];
const lRow=document.getElementById('lantern-row');
LANTERN_DATA.forEach(d=>{
  const wrap=document.createElement('div');
  wrap.className=`ln-wrap ${d.sw}`;
  wrap.style.animationDelay=d.delay;
  const str=document.createElement('div'); str.className='ln-string';
  const body=document.createElement('div'); body.className='ln-body';
  body.style.cssText=`width:${d.w}px;height:${d.h}px;
    background:radial-gradient(ellipse at 36% 30%,${d.c1},${d.c2});
    box-shadow:0 0 16px 4px ${d.gc}.6),0 0 36px 10px ${d.gc}.25);`;
  body.style.animation=`lnGlowPulse ${1.6+Math.random()*.8}s ease-in-out infinite alternate`;
  body.style.animationDelay=d.delay;
  const shine=document.createElement('div'); shine.className='ln-shine';
  const glow=document.createElement('div'); glow.className='ln-glow';
  glow.style.cssText=`width:${d.w*2}px;height:${d.h*2}px;
    background:radial-gradient(ellipse,${d.gc}.38) 0%,transparent 70%);
    left:${-d.w*.5}px;top:${-d.h*.5}px`;
  body.appendChild(shine); body.appendChild(glow);
  wrap.appendChild(str); wrap.appendChild(body);
  lRow.appendChild(wrap);
});

/* ═══════════════════════════════════════════
   STARS
═══════════════════════════════════════════ */
const SC=LOW?160:MOB?240:360;
const STARS=Array.from({length:SC},()=>({
  nx:Math.random(), ny:Math.random()*.88,
  r:.2+Math.random()*1.5,
  tw:Math.random()*Math.PI*2, spd:.006+Math.random()*.017,
  maxA:.15+Math.random()*.75,
  birth:T.stars+Math.random()*6,
  pf:.2+Math.random()*.9,
  cross:Math.random()>.72,
  color:Math.random()>.15?0:Math.floor(Math.random()*3),// 0=white,1=blue-ish,2=amber
}));
const STAR_COLORS=['255,252,228','200,220,255','255,230,160'];

/* ═══════════════════════════════════════════
   PARTICLES
═══════════════════════════════════════════ */
const PMAX=LOW?70:MOB?110:180;
const PARTS=[];
function mkP(active,ox,oy,burst){
  return{
    x:ox??Math.random()*C4.W, y:oy??C4.H*.1+Math.random()*C4.H*.85,
    vx:(Math.random()-.5)*(burst?4:.18),
    vy:burst?-(Math.random()*5+1):-(Math.random()*.3+.03),
    r:.5+Math.random()*(burst?2.5:1.8),
    life:1, decay:burst?(.016+Math.random()*.02):(.0008+Math.random()*.0014),
    hue:34+Math.random()*32, sat:60+Math.random()*.35,
    birth:active?0:T.part+Math.random()*5, active:!!active,
  };
}
for(let i=0;i<PMAX;i++) PARTS.push(mkP(false));

/* ═══════════════════════════════════════════
   SHOOTING STARS
═══════════════════════════════════════════ */
const SHOOTS=[]; let nextSh=T.shoot;
function spawnShoot(){
  const ltr=Math.random()>.45;
  SHOOTS.push({
    x:ltr?-20:C5.W+20, y:C5.H*(.04+Math.random()*.4),
    vx:ltr?(3.5+Math.random()*4):-(3.5+Math.random()*4),
    vy:1+Math.random()*2.4,
    len:MOB?80+Math.random()*110:120+Math.random()*180,
    life:1, decay:.016+Math.random()*.016, ia:0,
  });
}

/* ═══════════════════════════════════════════
   FIREWORKS
═══════════════════════════════════════════ */
const FW=[]; let fwActive=false;
const FW_COLS=['#FFD700','#FF6030','#4ECDC4','#C0392B','#9B59B6','#27AE60','#FF8C00','#3498DB','#E74C3C','#F1C40F'];
function spawnFW(x,y){
  const n=MOB?35:55;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, spd=2+Math.random()*5.5;
    FW.push({
      x,y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
      life:1, decay:.010+Math.random()*.016,
      r:1.3+Math.random()*2.5,
      col:FW_COLS[Math.floor(Math.random()*FW_COLS.length)],
      trail:[],
    });
  }
}

/* ═══════════════════════════════════════════
   GEO PATTERN  (offscreen cache)
═══════════════════════════════════════════ */
let geoCache=null;
function buildGeo(W,H){
  const oc=document.createElement('canvas');
  oc.width=W; oc.height=H;
  const g=oc.getContext('2d');
  const sz=Math.min(W,H)*(MOB?.092:.07);
  g.strokeStyle='rgba(212,175,55,1)'; g.lineWidth=MOB?.9:.65;
  function s8(x,y,r){
    g.save(); g.translate(x,y); g.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4, b=a+Math.PI/8, ir=r*.38;
      i===0?g.moveTo(Math.cos(a)*r,Math.sin(a)*r):g.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      g.lineTo(Math.cos(b)*ir,Math.sin(b)*ir);
    }
    g.closePath(); g.stroke();
    g.beginPath(); g.arc(0,0,r*.2,0,Math.PI*2); g.stroke();
    g.restore();
  }
  const step=sz*2.25;
  for(let y=-sz;y<H+sz*2;y+=step)
    for(let x=-sz;x<W+sz*2;x+=step)
      s8(x,y,sz*.84);
  return oc;
}

/* ═══════════════════════════════════════════
   AURORA
═══════════════════════════════════════════ */
function drawAurora(p,ctx,W,H){
  [{cy:.80,h:.28,ca:'rgba(8,34,72,',cb:'rgba(4,18,44,'},{cy:.62,h:.22,ca:'rgba(5,24,55,',cb:'rgba(3,13,34,'}].forEach(b=>{
    const gy=H*b.cy;
    const g=ctx.createLinearGradient(0,gy-H*b.h,0,gy+H*b.h*.5);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(.3,b.ca+(p*.15)+')');
    g.addColorStop(.6,b.cb+(p*.09)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  });
  // gold horizon glow
  const sg=ctx.createLinearGradient(0,H*.58,0,H);
  sg.addColorStop(0,'rgba(0,0,0,0)');
  sg.addColorStop(.5,`rgba(60,42,5,${p*.08+Math.sin(aphase*1.5)*.025})`);
  sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
}

/* ═══════════════════════════════════════════
   MOSQUE
═══════════════════════════════════════════ */
function drawMosque(p){
  const{ctx,W,H}=C2; ctx.save(); ctx.globalAlpha=p*.24;
  const s=Math.min(W,H)/640;
  ctx.translate(W/2,H); ctx.scale(s,s);
  const mg=ctx.createLinearGradient(0,-580,0,0);
  mg.addColorStop(0,'rgba(212,175,55,.65)'); mg.addColorStop(.3,'rgba(175,138,28,.30)');
  mg.addColorStop(.65,'rgba(90,62,8,.12)'); mg.addColorStop(1,'rgba(25,14,2,.03)');
  ctx.fillStyle=mg;
  // dome
  ctx.beginPath(); ctx.arc(0,-295,142,Math.PI,0);
  ctx.lineTo(142,-215); ctx.lineTo(-142,-215); ctx.closePath(); ctx.fill();
  // drum ring
  ctx.fillRect(-118,-254,236,44);
  // body
  ctx.fillRect(-215,-215,430,215);
  // tall minarets
  [[-340,-420,48],[296,-420,48]].forEach(([bx,top,w])=>{
    ctx.fillRect(bx,top,w,-top); ctx.beginPath();
    ctx.arc(bx+w/2,top,w/2+2,Math.PI,0); ctx.fill();
    ctx.fillRect(bx+w*.25,top-42,w*.5,44);
  });
  // medium minarets
  [[-245,-325,32],[213,-325,32]].forEach(([bx,top,w])=>{
    ctx.fillRect(bx,top,w,-top); ctx.beginPath();
    ctx.arc(bx+w/2,top,w/2+1,Math.PI,0); ctx.fill();
  });
  // arched windows
  [-154,-77,0,77,154].forEach(wx=>{
    ctx.beginPath(); ctx.rect(wx-18,-160,36,95);
    ctx.arc(wx,-160,18,Math.PI,0); ctx.fill();
  });
  ctx.restore();
  // ground glow
  const rg=ctx.createLinearGradient(0,H*.72,0,H);
  rg.addColorStop(0,`rgba(212,175,55,${p*.09})`); rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save(); ctx.fillStyle=rg; ctx.fillRect(0,H*.72,W,H*.28); ctx.restore();
}

/* ═══════════════════════════════════════════
   MOON  (full 3-D cinematic)
═══════════════════════════════════════════ */
function drawMoon(p){
  if(p<=0)return;
  const{ctx,W,H}=C3;
  const R=Math.min(W,H)*(MOB?.20:.168);
  const MX=W/2, MY=H*(MOB?.295:.272);
  const fy=Math.sin(t*.38)*(MOB?4:7), Y=MY+fy;
  ctx.save(); ctx.globalAlpha=Math.min(1,p*1.6);

  // deep atmosphere
  const h0=ctx.createRadialGradient(MX,Y,R*.3,MX,Y,R*5.2);
  h0.addColorStop(0,'rgba(255,195,50,.20)'); h0.addColorStop(.22,'rgba(180,138,20,.09)');
  h0.addColorStop(.55,'rgba(60,44,4,.025)'); h0.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h0; ctx.beginPath(); ctx.arc(MX,Y,R*5.2,0,Math.PI*2); ctx.fill();

  // pulsing corona
  const pulse=.9+Math.sin(t*1.08)*.1;
  const h1=ctx.createRadialGradient(MX,Y,R*.28,MX,Y,R*2.5*pulse);
  h1.addColorStop(0,'rgba(255,234,100,.42)'); h1.addColorStop(.35,'rgba(212,175,55,.18)');
  h1.addColorStop(.72,'rgba(120,90,8,.055)'); h1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h1; ctx.beginPath(); ctx.arc(MX,Y,R*2.5*pulse,0,Math.PI*2); ctx.fill();

  // inner warm glow
  const h2=ctx.createRadialGradient(MX,Y,R*.55,MX,Y,R*1.35);
  h2.addColorStop(0,'rgba(255,210,70,.28)'); h2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h2; ctx.beginPath(); ctx.arc(MX,Y,R*1.35,0,Math.PI*2); ctx.fill();

  // moon disk — 3D lit top-left
  const disk=ctx.createRadialGradient(MX-R*.32,Y-R*.38,R*.02,MX,Y,R);
  disk.addColorStop(0,'#fffee8'); disk.addColorStop(.10,'#fff0a0');
  disk.addColorStop(.26,'#ffd93a'); disk.addColorStop(.48,'#eba800');
  disk.addColorStop(.68,'#b87000'); disk.addColorStop(.85,'#6b3800');
  disk.addColorStop(1,'#1a0c00');
  ctx.shadowColor='rgba(255,200,50,.85)'; ctx.shadowBlur=60*p;
  ctx.fillStyle=disk; ctx.beginPath(); ctx.arc(MX,Y,R,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // crescent mask
  const shift=R*.575;
  const cr=ctx.createRadialGradient(MX+shift-R*.04,Y-R*.055,R*.02,MX+shift,Y,R*1.1);
  cr.addColorStop(0,'rgba(1,2,12,.995)'); cr.addColorStop(.46,'rgba(2,4,16,.975)');
  cr.addColorStop(.76,'rgba(4,6,20,.9)'); cr.addColorStop(1,'rgba(6,8,24,0)');
  ctx.fillStyle=cr; ctx.beginPath(); ctx.arc(MX+shift,Y,R*1.06,0,Math.PI*2); ctx.fill();

  // depth inner shadow
  const ds=ctx.createRadialGradient(MX+R*.22,Y+R*.14,0,MX+R*.22,Y+R*.14,R*.6);
  ds.addColorStop(0,'rgba(0,0,0,.28)'); ds.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ds; ctx.beginPath(); ctx.arc(MX,Y,R,0,Math.PI*2); ctx.fill();

  // rim back-light right
  const rim=ctx.createRadialGradient(MX+R*.83,Y,0,MX+R*.83,Y,R*.62);
  rim.addColorStop(0,'rgba(255,225,140,.26)'); rim.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rim; ctx.beginPath(); ctx.arc(MX,Y,R,0,Math.PI*2); ctx.fill();

  // specular top-left
  const sp=ctx.createRadialGradient(MX-R*.34,Y-R*.41,0,MX-R*.34,Y-R*.41,R*.44);
  sp.addColorStop(0,'rgba(255,255,250,.68)'); sp.addColorStop(.4,'rgba(255,248,195,.24)');
  sp.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sp; ctx.beginPath(); ctx.arc(MX,Y,R,0,Math.PI*2); ctx.fill();

  // subtle surface texture streaks
  for(let si=0;si<4;si++){
    const sa=si*Math.PI/4+Math.PI*.15;
    const sx1=MX+Math.cos(sa)*R*.15, sy1=Y+Math.sin(sa)*R*.15;
    const sx2=MX+Math.cos(sa)*R*.72, sy2=Y+Math.sin(sa)*R*.72;
    const sg2=ctx.createLinearGradient(sx1,sy1,sx2,sy2);
    sg2.addColorStop(0,'rgba(255,200,50,.0)');
    sg2.addColorStop(.5,`rgba(200,140,10,${p*.035})`);
    sg2.addColorStop(1,'rgba(255,200,50,.0)');
    ctx.strokeStyle=sg2; ctx.lineWidth=R*.12;
    ctx.beginPath(); ctx.moveTo(sx1,sy1); ctx.lineTo(sx2,sy2);
    ctx.stroke();
  }

  // rotating light rays
  const rA=Math.min(1,p*1.4)*(p>.55?.13:.04);
  if(rA>0){
    const rCount=LOW?8:12;
    for(let ri=0;ri<rCount;ri++){
      const ang=ri*(Math.PI*2/rCount)+t*.013;
      ctx.save(); ctx.translate(MX,Y); ctx.rotate(ang);
      const rl=ctx.createLinearGradient(0,0,R*5,0);
      rl.addColorStop(0,'rgba(255,220,70,.22)');
      rl.addColorStop(.4,'rgba(212,175,55,.08)');
      rl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=rA; ctx.fillStyle=rl;
      ctx.beginPath();
      ctx.moveTo(R*.88,-3); ctx.lineTo(R*5,-10);
      ctx.lineTo(R*5,10); ctx.lineTo(R*.88,3);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha=Math.min(1,p*1.6);
  }

  // companion star
  const sx=MX+R*1.14, sy=Y-R*.80;
  const sAge=Math.min(1,(p-.44)*2.6);
  if(sAge>0){
    const sa2=sAge*(.55+Math.sin(t*2.4)*.45);
    const sr=MOB?11:14;
    const sg3=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
    sg3.addColorStop(0,`rgba(255,248,200,${sa2})`);
    sg3.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg3; ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=`rgba(255,244,188,${sa2*.75})`; ctx.lineWidth=.95;
    const cl=MOB?14:20;
    [0,1,2,3].forEach(i=>{const a=i*Math.PI/2; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(a)*cl,sy+Math.sin(a)*cl); ctx.stroke();});
    ctx.lineWidth=.45;
    [1,3,5,7].forEach(i=>{const a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(a)*cl*.58,sy+Math.sin(a)*cl*.58); ctx.stroke();});
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════
   DRAW STARS
═══════════════════════════════════════════ */
function drawStars(){
  const{ctx,W,H}=C1;
  STARS.forEach(s=>{
    if(t<s.birth)return;
    s.tw+=s.spd;
    const age=Math.min(1,(t-s.birth)/4.8);
    const alpha=age*s.maxA*(.38+Math.sin(s.tw)*.62);
    const ox=srx*-24*s.pf, oy=sry*-14*s.pf;
    const px=((s.nx*W+ox)%W+W)%W;
    const py=((s.ny*H+oy)%H+H)%H;
    const col=STAR_COLORS[s.color];
    // halo
    const sg=ctx.createRadialGradient(px,py,0,px,py,s.r*5.5);
    sg.addColorStop(0,`rgba(${col},${alpha*.5})`); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(px,py,s.r*5.5,0,Math.PI*2); ctx.fill();
    // core
    ctx.fillStyle=`rgba(${col},${alpha})`;
    ctx.beginPath(); ctx.arc(px,py,s.r,0,Math.PI*2); ctx.fill();
    // cross glint
    if(s.cross&&alpha>.32){
      ctx.strokeStyle=`rgba(${col},${alpha*.5})`; ctx.lineWidth=.5;
      const gl=s.r*5.5+1.5;
      ctx.beginPath(); ctx.moveTo(px-gl,py); ctx.lineTo(px+gl,py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px,py-gl); ctx.lineTo(px,py+gl); ctx.stroke();
    }
  });
}

/* ═══════════════════════════════════════════
   SHOOTING STARS
═══════════════════════════════════════════ */
function stepShoots(){
  const{ctx}=C5;
  for(let i=SHOOTS.length-1;i>=0;i--){
    const s=SHOOTS[i];
    s.x+=s.vx; s.y+=s.vy; s.life-=s.decay; s.ia=Math.min(1,s.ia+.07);
    if(s.life<=0){SHOOTS.splice(i,1);continue;}
    const ang=Math.atan2(s.vy,s.vx);
    const tx=s.x-Math.cos(ang)*s.len, ty=s.y-Math.sin(ang)*s.len;
    const g=ctx.createLinearGradient(tx,ty,s.x,s.y);
    g.addColorStop(0,'rgba(255,248,220,0)');
    g.addColorStop(.5,`rgba(255,240,175,${s.life*s.ia*.3})`);
    g.addColorStop(1,`rgba(255,255,255,${s.life*s.ia*.96})`);
    ctx.strokeStyle=g; ctx.lineWidth=1.9;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(s.x,s.y); ctx.stroke();
    const hg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,10);
    hg.addColorStop(0,`rgba(255,255,242,${s.life*s.ia})`); hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(s.x,s.y,10,0,Math.PI*2); ctx.fill();
  }
  if(t>nextSh&&Math.random()>.25){spawnShoot();nextSh=t+2.5+Math.random()*5.5;}
}

/* ═══════════════════════════════════════════
   FIREWORKS
═══════════════════════════════════════════ */
function stepFW(){
  const{ctx}=C5;
  for(let i=FW.length-1;i>=0;i--){
    const f=FW[i];
    f.trail.push({x:f.x,y:f.y,l:f.life});
    if(f.trail.length>8)f.trail.shift();
    f.x+=f.vx; f.y+=f.vy; f.vy+=.065; f.vx*=.97; f.vy*=.97;
    f.life-=f.decay;
    if(f.life<=0){FW.splice(i,1);continue;}
    // trail
    f.trail.forEach((pt,ti)=>{
      ctx.globalAlpha=(ti/f.trail.length)*f.life*.4;
      ctx.fillStyle=f.col;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,f.r*(ti/f.trail.length)*.55,0,Math.PI*2); ctx.fill();
    });
    // head
    ctx.globalAlpha=f.life; ctx.fillStyle=f.col;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
    // glow
    const fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*4.5);
    fg.addColorStop(0,f.col); fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fg; ctx.globalAlpha=f.life*.3;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r*4.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* ═══════════════════════════════════════════
   PARTICLES
═══════════════════════════════════════════ */
function stepParts(){
  const{ctx,W,H}=C4;
  while(PARTS.length>PMAX+80)PARTS.shift();
  PARTS.forEach(p=>{
    if(t<p.birth)return;
    if(!p.active){p.active=true; p.x=Math.random()*W; p.y=H*.1+Math.random()*H*.85;}
    p.x+=p.vx+srx*-.04*p.r; p.y+=p.vy; p.life-=p.decay;
    if(p.y<-15||p.life<=0||p.x<-15||p.x>W+15){
      p.x=Math.random()*W; p.y=H*.1+Math.random()*H*.85;
      p.life=1; p.vy=-(Math.random()*.3+.03); p.vx=(Math.random()-.5)*.17;
    }
    const a=p.life*.6;
    const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6.5);
    pg.addColorStop(0,`hsla(${p.hue},${p.sat}%,74%,${a*.32})`);
    pg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*6.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`hsla(${p.hue},${p.sat}%,86%,${a})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
}

/* ═══════════════════════════════════════════
   TEXT REVEAL
═══════════════════════════════════════════ */
const shown={};
let fwDone=false;
function checkText(){
  [['ar',T.ar],['orn',T.orn],['en',T.en],['sub',T.sub],['ur',T.ur],['hint',T.hint],
   ['lantern-row',T.lantern],['bunting',T.bunting]
  ].forEach(([id,ts])=>{
    if(!shown[id]&&t>ts){shown[id]=true;const el=document.getElementById(id);if(el)el.classList.add('show');}
  });
  // auto celebration fireworks at text reveal
  if(!fwDone&&t>T.fireworks){
    fwDone=true;
    autoFireworks();
  }
}

function autoFireworks(){
  const W=C5.W,H=C5.H;
  const bursts=[
    [W*.2,H*.25],[W*.8,H*.22],[W*.5,H*.35],
    [W*.15,H*.45],[W*.85,H*.38],[W*.5,H*.18],
  ];
  bursts.forEach(([x,y],i)=>setTimeout(()=>{
    spawnFW(x,y);
    // screen flash
    const fl=document.getElementById('flash');
    fl.classList.add('pop');
    setTimeout(()=>fl.classList.remove('pop'),120);
    // burst particles
    for(let j=0;j<(MOB?14:22);j++){
      const p=mkP(true,x,y,true);
      PARTS.push(p);
    }
  },i*280));
  // second wave
  setTimeout(()=>{
    for(let k=0;k<(MOB?3:5);k++)
      setTimeout(()=>spawnFW(W*(.1+Math.random()*.8),H*(.1+Math.random()*.45)),k*200);
  },2200);
}

/* ═══════════════════════════════════════════
   TAP / CLICK  EFFECT
═══════════════════════════════════════════ */
function tapAt(x,y){
  // two ripple rings
  [0,1].forEach(i=>{
    const r=document.createElement('div');
    r.className='ripple'+(i?' ripple2':'');
    const sz=Math.min(innerWidth,innerHeight)*(MOB?.6:.5);
    r.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px`;
    document.body.appendChild(r);
    r.addEventListener('animationend',()=>r.remove());
  });
  // mini firework
  spawnFW(x,y);
  // burst particles
  for(let i=0;i<(MOB?16:26);i++) PARTS.push(mkP(true,x,y,true));
}
addEventListener('click',e=>tapAt(e.clientX,e.clientY));
addEventListener('touchstart',e=>{const t2=e.touches[0];tapAt(t2.clientX,t2.clientY);},{passive:true});

/* ═══════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════ */
function frame(ts){
  if(!lt)lt=ts;
  const dt=Math.min((ts-lt)/1000,.05);
  lt=ts; t+=dt; aphase+=dt*.055;

  // smooth parallax lerp
  srx+=(rx-srx)*.055; sry+=(ry-sry)*.055;

  const{ctx:bg,W,H}=C0;

  /* ── Sky background ── */
  const bA=Math.min(1,Math.max(0,(t-T.glow)/3.0));
  const bCX=W/2+srx*W*.06, bCY=H/2+sry*H*.04;
  const bgG=bg.createRadialGradient(bCX,bCY*.36,0,bCX,H*.52,Math.max(W,H)*.96);
  bgG.addColorStop(0,`rgba(14,18,50,${bA})`); bgG.addColorStop(.22,`rgba(9,12,34,${bA})`);
  bgG.addColorStop(.52,`rgba(5,7,20,${bA*.94})`); bgG.addColorStop(1,'rgba(0,0,0,1)');
  bg.fillStyle=bgG; bg.fillRect(0,0,W,H);

  // aurora
  if(t>T.aurora) drawAurora(Math.min(1,(t-T.aurora)/4),bg,W,H);

  // center warmth
  if(t>T.glow){
    const gp=Math.min(1,(t-T.glow)/4);
    const cg=bg.createRadialGradient(W/2,H*.30,0,W/2,H*.38,Math.min(W,H)*.58);
    cg.addColorStop(0,`rgba(52,42,12,${gp*.28})`); cg.addColorStop(.4,`rgba(24,18,4,${gp*.11})`);
    cg.addColorStop(1,'rgba(0,0,0,0)');
    bg.fillStyle=cg; bg.fillRect(0,0,W,H);
  }

  /* ── Stars canvas ── */
  C1.ctx.clearRect(0,0,C1.W,C1.H);
  drawStars();

  /* ── Mosque + geo ── */
  C2.ctx.clearRect(0,0,C2.W,C2.H);
  if(t>T.geo){
    if(!geoCache||geoCache.width!==C2.W) geoCache=buildGeo(C2.W,C2.H);
    const gp2=Math.min(1,(t-T.geo)/3.5);
    C2.ctx.globalAlpha=gp2*.11; C2.ctx.drawImage(geoCache,0,0,C2.W,C2.H); C2.ctx.globalAlpha=1;
  }
  if(t>T.mosque) drawMosque(Math.min(1,(t-T.mosque)/5.5));

  /* ── Moon ── */
  C3.ctx.clearRect(0,0,C3.W,C3.H);
  if(t>T.moon){
    const mp=Math.min(1,(t-T.moon)/(T.moonFull-T.moon));
    drawMoon(mp<.5?2*mp*mp:1-Math.pow(-2*mp+2,2)/2);
  }

  /* ── Particles ── */
  C4.ctx.clearRect(0,0,C4.W,C4.H);
  stepParts();

  /* ── FX: shoots + fireworks ── */
  C5.ctx.clearRect(0,0,C5.W,C5.H);
  stepShoots();
  stepFW();

  checkText();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
