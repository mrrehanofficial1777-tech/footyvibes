<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
}

/* Background glow */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #0a0a2a, #000);
    opacity: 0;
    animation: fadeBg 3s ease forwards 1s;
}

@keyframes fadeBg {
    to { opacity: 1; }
}

/* Moon */
.moon {
    position: absolute;
    top: 40%;
    left: 50%;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 40%, #ddd 60%);
    transform: translate(-50%, -50%) scale(0.5);
    box-shadow: -25px 0 0 0 #000;
    opacity: 0;
    animation: moonReveal 3s ease forwards 2s;
}

@keyframes moonReveal {
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* Eid Text */
.text {
    position: absolute;
    top: 55%;
    width: 100%;
    text-align: center;
    font-size: 48px;
    color: #fff;
    letter-spacing: 3px;
    opacity: 0;
    transform: scale(0.8);
    text-shadow: 
        0 0 10px #fff,
        0 0 20px gold,
        0 0 40px gold;
    animation: textShow 3s ease forwards 3.5s;
}

@keyframes textShow {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Particles */
.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: float 10s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    to {
        transform: translateY(-10vh);
        opacity: 1;
    }
}
</style>

</head>
<body>

<div class="bg"></div>
<div class="moon"></div>
<div class="text">Eid Mubarak ✨</div>

<script>
// particles create
for(let i = 0; i < 40; i++) {
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (5 + Math.random() * 10) + "s";
    p.style.opacity = Math.random();
    document.body.appendChild(p);
}
</script>

</body>
</html>
