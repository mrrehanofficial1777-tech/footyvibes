<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart AI Chatbot</title>
<h1> COMING soon Ai CHATBOAT </h1>
<style>
  body { font-family: Arial, sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding:50px; }
  .chat-container { width: 400px; background: #fff; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); display:flex; flex-direction:column; }
  .chat-box { flex:1; padding:15px; overflow-y:auto; max-height:500px; }
  .message { margin:10px 0; padding:10px 15px; border-radius:20px; max-width:80%; }
  .user { background:#DCF8C6; align-self:flex-end; }
  .bot { background:#eee; align-self:flex-start; }
  .input-box { display:flex; border-top:1px solid #ccc; }
  .input-box input { flex:1; padding:10px; border:none; outline:none; }
  .input-box button { padding:10px; border:none; background:#2196F3; color:#fff; cursor:pointer; }

</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-box" id="chatBox"></div>
  <div class="input-box">
    <input type="text" id="userInput" placeholder="Talk with Mee" />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const apiKey = "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";

// Append messages
function appendMessage(msg, sender) {
  const div = document.createElement('div');
  div.classList.add('message', sender);
  div.innerHTML = msg;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// Send user message and call AI
function sendMessage() {
  const text = userInput.value.trim();
  if(text === '') return;
  appendMessage(text, 'user');
  userInput.value = '';

  appendMessage("Typing...", 'bot');
  const botDiv = chatBox.querySelector('.bot:last-child');

  fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: "gpt-3.5-turbo",
      messages: [{ role: "user", content: text }]
    })
  })
  .then(response => response.json())
  .then(data => {
    botDiv.innerHTML = data.choices[0].message.content;
  })
  .catch(err => {
    botDiv.innerHTML = "Coming Soon 😅sabr karoo";
    console.error(err);
  });
}

// Send on Enter
userInput.addEventListener('keypress', function(e){
  if(e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
