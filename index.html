<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Eid Mubarak ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
body{
  width:100%;height:100%;
  min-height:100vh;min-height:-webkit-fill-available;
  background:#000;overflow:hidden;
  overscroll-behavior:none;touch-action:none;
}

/* ── CANVAS STACK ── */
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#c0{z-index:1}   /* sky nebula background */
#c1{z-index:2}   /* milky way + deep stars */
#c2{z-index:3}   /* mid stars */
#c3{z-index:4}   /* scene: mosque+geo+moon */
#c4{z-index:5}   /* floating particles */
#c5{z-index:6}   /* fx: shoots+fireworks+comets */
#c6{z-index:7;pointer-events:none} /* post: vignette+grade */

/* ── LANTERNS ── */
#lrow{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-around;
  padding:0 .5vw;z-index:8;
  pointer-events:none;
  opacity:0;transition:opacity 3s cubic-bezier(.16,1,.3,1);
}
#lrow.on{opacity:1}

.lw{display:flex;flex-direction:column;align-items:center;transform-origin:top center}
.lw:nth-child(1){animation:sw1 3.2s ease-in-out infinite}
.lw:nth-child(2){animation:sw2 3.9s ease-in-out infinite}
.lw:nth-child(3){animation:sw3 2.8s ease-in-out infinite}
.lw:nth-child(4){animation:sw4 4.2s ease-in-out infinite}
.lw:nth-child(5){animation:sw5 3.5s ease-in-out infinite}
.lw:nth-child(6){animation:sw6 3.3s ease-in-out infinite}
.lw:nth-child(7){animation:sw1 4.0s ease-in-out infinite}
.lw:nth-child(8){animation:sw3 3.6s ease-in-out infinite}
@keyframes sw1{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes sw2{0%,100%{transform:rotate(9deg)} 50%{transform:rotate(-9deg)}}
@keyframes sw3{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(7deg)}}
@keyframes sw4{0%,100%{transform:rotate(7deg)} 50%{transform:rotate(-11deg)}}
@keyframes sw5{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(10deg)}}
@keyframes sw6{0%,100%{transform:rotate(11deg)}50%{transform:rotate(-7deg)}}

.ls{
  width:1px;height:clamp(34px,6vh,72px);
  background:linear-gradient(#d4af37,rgba(212,175,55,.15));
  position:relative;
}
.ls::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(rgba(255,240,160,.5),transparent);
  filter:blur(1.5px);
}
.lb{
  border-radius:43% 43% 55% 55%/36% 36% 64% 64%;
  position:relative;overflow:hidden;
  transition:box-shadow .3s;
}
.lb::before{
  content:'';position:absolute;top:-13%;left:50%;transform:translateX(-50%);
  width:25%;height:15%;border-radius:3px 3px 0 0;
  background:linear-gradient(#ffe090,#a07010);
}
.lb::after{
  content:'';position:absolute;bottom:-14%;left:50%;transform:translateX(-50%);
  width:15%;height:16%;border-radius:50%;
  background:linear-gradient(#ffe090,#a07010);
}
.lb-sh{
  position:absolute;top:10%;left:14%;width:32%;height:52%;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.38) 0%,transparent 80%);
}
.lb-gl{
  position:absolute;inset:-60%;border-radius:50%;
  animation:lbGlow 2s ease-in-out infinite alternate;
}
.lb-cross{
  position:absolute;inset:0;
  background:
    linear-gradient(transparent 47%,rgba(255,255,200,.1) 50%,transparent 53%),
    linear-gradient(90deg,transparent 47%,rgba(255,255,200,.1) 50%,transparent 53%);
}
@keyframes lbGlow{from{opacity:.35;transform:scale(.82)}to{opacity:.95;transform:scale(1.22)}}

/* bunting */
#bunt{
  position:fixed;top:0;left:0;right:0;
  height:clamp(42px,8vh,88px);
  z-index:8;pointer-events:none;
  opacity:0;transition:opacity 3s ease .6s;
}
#bunt.on{opacity:1}

/* ── STAGE ── */
#stage{
  position:fixed;inset:0;z-index:9;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  pointer-events:none;
  padding-bottom:max(clamp(32px,7vh,72px), env(safe-area-inset-bottom,0px) + 30px);
}

/* Arabic — embossed gold 3D */
#ar{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(2.9rem,11.5vw,8rem);
  line-height:1;letter-spacing:.04em;text-align:center;
  color:transparent;
  background:linear-gradient(175deg,
    #fffff4 0%,#fff5a0 12%,#ffd84a 28%,
    #d4af37 46%,#ffe880 64%,#c07800 80%,#7a4a00 100%);
  -webkit-background-clip:text;background-clip:text;
  opacity:0;transform:translateY(42px) scale(.8);
  filter:blur(28px);
  will-change:opacity,filter,transform;
  transition:
    opacity   4.5s cubic-bezier(.16,1,.3,1),
    filter    4.5s cubic-bezier(.16,1,.3,1),
    transform 4.5s cubic-bezier(.16,1,.3,1);
}
#ar.on{
  opacity:1;transform:translateY(0) scale(1);
  filter:
    drop-shadow(0 1px 0 rgba(255,255,200,.95))
    drop-shadow(0 -1px 0 rgba(80,40,0,.9))
    drop-shadow(0 2px 4px rgba(120,70,0,.6))
    drop-shadow(0 0 42px rgba(212,175,55,.95))
    drop-shadow(0 0 100px rgba(212,175,55,.48))
    drop-shadow(0 8px 28px rgba(0,0,0,1))
    blur(0px);
  animation:arFloat 5.5s ease-in-out 4.5s infinite,
            arGlow  4s  ease-in-out 4.5s infinite;
}
@keyframes arFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes arGlow{
  0%,100%{filter:
    drop-shadow(0 1px 0 rgba(255,255,200,.95))
    drop-shadow(0 -1px 0 rgba(80,40,0,.9))
    drop-shadow(0 0 42px rgba(212,175,55,.95))
    drop-shadow(0 0 100px rgba(212,175,55,.48))
    drop-shadow(0 8px 28px rgba(0,0,0,1))}
  50%{filter:
    drop-shadow(0 1px 0 rgba(255,255,200,1))
    drop-shadow(0 -1px 0 rgba(80,40,0,.9))
    drop-shadow(0 0 70px rgba(255,215,60,1))
    drop-shadow(0 0 160px rgba(212,175,55,.7))
    drop-shadow(0 8px 28px rgba(0,0,0,1))}
}

/* shine sweep */
#ar-sw{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit;
  background:linear-gradient(108deg,
    transparent 30%,rgba(255,255,245,.6) 50%,transparent 70%);
  opacity:0;
}
#ar.on #ar-sw{opacity:1;animation:swp 5.5s cubic-bezier(.4,0,.6,1) 5s infinite}
@keyframes swp{0%{transform:translateX(-160%)}55%,100%{transform:translateX(180%)}}

/* ornament */
#orn{
  display:flex;align-items:center;gap:14px;
  margin:clamp(9px,1.9vh,17px) 0 clamp(7px,1.7vh,14px);
  opacity:0;transform:scaleX(.25);
  transition:opacity 2.4s ease, transform 2.4s cubic-bezier(.34,1.56,.64,1);
}
#orn.on{opacity:1;transform:scaleX(1)}
.ol{
  height:1px;width:clamp(38px,9.5vw,128px);
  background:linear-gradient(to right,transparent,rgba(212,175,55,.8),transparent);
  position:relative;
}
.ol::after{
  content:'';position:absolute;top:-1px;inset-x:0;height:3px;
  background:inherit;filter:blur(3px);opacity:.55;
}
.ol.r{background:linear-gradient(to left,transparent,rgba(212,175,55,.8),transparent)}
.os{
  font-size:clamp(.9rem,2.3vw,1.38rem);white-space:nowrap;
  color:rgba(212,175,55,.92);
  text-shadow:0 0 14px rgba(212,175,55,.9),0 0 38px rgba(212,175,55,.45);
  animation:osPulse 3.3s ease-in-out infinite 2s;
}
@keyframes osPulse{
  50%{text-shadow:0 0 28px rgba(255,232,80,1),0 0 70px rgba(212,175,55,.7)}
}

/* English */
#en{
  font-family:'Cinzel Decorative',cursive;font-weight:700;
  font-size:clamp(.95rem,4.2vw,3.1rem);
  letter-spacing:.26em;text-align:center;
  color:transparent;
  background:linear-gradient(160deg,
    #fffff4 0%,#fff5c0 14%,#ffd84a 30%,
    #d4af37 50%,#fff8b8 68%,#c8880a 85%,#7a5000 100%);
  -webkit-background-clip:text;background-clip:text;
  opacity:0;transform:translateY(24px) scale(.88);
  filter:blur(18px);
  will-change:opacity,filter,transform;
  transition:
    opacity   3.6s cubic-bezier(.16,1,.3,1) .18s,
    filter    3.6s cubic-bezier(.16,1,.3,1) .18s,
    transform 3.6s cubic-bezier(.16,1,.3,1) .18s;
  padding-right:.26em;max-width:95vw;position:relative;overflow:hidden;
}
#en.on{
  opacity:1;transform:translateY(0) scale(1);
  filter:
    drop-shadow(0 1px 0 rgba(255,255,200,.9))
    drop-shadow(0 -1px 0 rgba(80,40,0,.8))
    drop-shadow(0 0 32px rgba(212,175,55,.9))
    drop-shadow(0 0 88px rgba(212,175,55,.42))
    drop-shadow(0 5px 22px rgba(0,0,0,1))
    blur(0px);
  animation:enGlow 6s ease-in-out 4s infinite;
}
@keyframes enGlow{
  0%,100%{filter:drop-shadow(0 0 32px rgba(212,175,55,.9)) drop-shadow(0 0 88px rgba(212,175,55,.42)) drop-shadow(0 5px 22px rgba(0,0,0,1)) blur(0px)}
  50%{filter:drop-shadow(0 0 58px rgba(255,222,80,1)) drop-shadow(0 0 130px rgba(212,175,55,.65)) drop-shadow(0 5px 22px rgba(0,0,0,1)) blur(0px)}
}
#en::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(108deg,transparent 30%,rgba(255,255,245,.5) 50%,transparent 70%);
  opacity:0;
}
#en.on::after{opacity:1;animation:swp 7s cubic-bezier(.4,0,.6,1) 6s infinite}

/* tagline */
#sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(.73rem,2.1vw,1.04rem);letter-spacing:.2em;text-align:center;
  color:rgba(255,240,180,0);
  margin-top:clamp(8px,1.5vh,15px);padding:0 14px;max-width:88vw;
  transition:color 3.8s ease;
  text-shadow:0 0 28px rgba(212,175,55,.48);
}
#sub.on{color:rgba(255,240,180,.58)}

/* urdu */
#ur{
  font-family:'Amiri',serif;
  font-size:clamp(.82rem,2.4vw,1.18rem);
  color:rgba(255,228,135,0);
  margin-top:clamp(5px,1vh,10px);letter-spacing:.05em;text-align:center;
  transition:color 3.5s ease .5s;
  text-shadow:0 0 22px rgba(212,175,55,.42);
}
#ur.on{color:rgba(255,228,135,.44)}

/* ── BOTTOM HINT ── */
#hint{
  position:fixed;
  bottom:max(16px, env(safe-area-inset-bottom,0px) + 10px);
  left:50%;transform:translateX(-50%);
  z-index:10;pointer-events:none;
  opacity:0;transition:opacity 2.8s ease;
  display:flex;flex-direction:column;align-items:center;gap:7px;white-space:nowrap;
}
#hint.on{opacity:1}
.htxt{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(.59rem,.8vw,.74rem);letter-spacing:.32em;
  color:rgba(212,175,55,.38);
}
.dots{display:flex;gap:8px}
.dot{
  width:3px;height:3px;border-radius:50%;
  background:rgba(212,175,55,.5);
  box-shadow:0 0 5px rgba(212,175,55,.4);
  animation:dp 2.7s ease-in-out infinite;
}
.dot:nth-child(2){animation-delay:.55s}.dot:nth-child(3){animation-delay:1.1s}
@keyframes dp{
  0%,100%{opacity:.18;transform:scale(1)}
  50%{opacity:1;transform:scale(2.4)}
}

/* ── TAP RIPPLE ── */
.rip{
  position:fixed;border-radius:50%;pointer-events:none;z-index:12;
  border:1px solid rgba(212,175,55,.6);
  transform:translate(-50%,-50%) scale(0);
  box-shadow:0 0 18px rgba(212,175,55,.2);
  animation:rOut 1.4s cubic-bezier(.22,1,.36,1) forwards;
}
.rip2{border-color:rgba(212,175,55,.22);animation-delay:.2s}
.rip3{border-color:rgba(212,175,55,.1);animation-delay:.4s}
@keyframes rOut{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}

/* ── FLASH ── */
#flash{
  position:fixed;inset:0;z-index:20;pointer-events:none;background:rgba(0,0,0,0);
  transition:background .07s;
}
#flash.pop{background:rgba(255,215,60,.12)}
</style>
</head>
<body>

<canvas id="c0"></canvas><!-- sky/nebula -->
<canvas id="c1"></canvas><!-- deep stars/milky way -->
<canvas id="c2"></canvas><!-- mid stars -->
<canvas id="c3"></canvas><!-- scene -->
<canvas id="c4"></canvas><!-- particles -->
<canvas id="c5"></canvas><!-- fx -->
<canvas id="c6"></canvas><!-- post -->

<!-- Bunting -->
<svg id="bunt" viewBox="0 0 1200 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gf"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M0,8 Q100,72 200,22 Q300,72 400,16 Q500,72 600,14 Q700,72 800,18 Q900,72 1000,20 Q1100,72 1200,8"
    fill="none" stroke="rgba(212,175,55,.55)" stroke-width="1.5" filter="url(#gf)"/>
  <path d="M0,8 Q100,72 200,22 Q300,72 400,16 Q500,72 600,14 Q700,72 800,18 Q900,72 1000,20 Q1100,72 1200,8"
    fill="none" stroke="rgba(255,240,160,.18)" stroke-width="4"/>
</svg>

<!-- Lanterns -->
<div id="lrow"></div>

<!-- Stage -->
<div id="stage">
  <div id="ar" style="position:relative"><span id="ar-sw"></span>عيد مبارك</div>
  <div id="orn"><div class="ol"></div><span class="os">✦ ☪ ✦</span><div class="ol r"></div></div>
  <div id="en">EID MUBARAK</div>
  <div id="sub">May peace, joy &amp; blessings fill your world</div>
  <div id="ur">خوشیاں اور برکتیں آپ کے ساتھ رہیں</div>
</div>

<div id="hint">
  <div class="htxt">✦ &nbsp;ALWAYS BLESSED&nbsp; ✦</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
<div id="flash"></div>

<script>
'use strict';
/* ═══════════════════════════
   DEVICE TIERS
═══════════════════════════ */
const IS_MOB = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||innerWidth<768;
const CORES  = navigator.hardwareConcurrency||4;
const IS_LOW = IS_MOB && CORES<=4;
const DPR    = Math.min(devicePixelRatio||1, IS_LOW?1.2:IS_MOB?1.6:2.2);

/* ═══════════════════════════
   CANVAS FACTORY
═══════════════════════════ */
function mkC(id){
  const el=document.getElementById(id);
  const ctx=el.getContext('2d',{alpha:true});
  let W=0,H=0;
  function r(){
    W=innerWidth;H=innerHeight;
    el.width=Math.round(W*DPR);el.height=Math.round(H*DPR);
    el.style.width=W+'px';el.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  r();addEventListener('resize',r);addEventListener('orientationchange',()=>setTimeout(r,280));
  return{ctx,get W(){return W},get H(){return H}};
}
const C0=mkC('c0'),C1=mkC('c1'),C2=mkC('c2'),C3=mkC('c3');
const C4=mkC('c4'),C5=mkC('c5'),C6=mkC('c6');

/* ═══════════════════════════
   PARALLAX INPUT
═══════════════════════════ */
let px=0,py=0,spx=0,spy=0;
addEventListener('mousemove',e=>{px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;});
addEventListener('touchmove',e=>{const t=e.touches[0];px=(t.clientX/innerWidth-.5)*2;py=(t.clientY/innerHeight-.5)*2;},{passive:true});
if(IS_MOB&&window.DeviceOrientationEvent)addEventListener('deviceorientation',e=>{if(e.gamma!=null){px=Math.max(-1,Math.min(1,e.gamma/24));py=Math.max(-1,Math.min(1,(e.beta-30)/34));}},true);

/* ═══════════════════════════
   TIMELINE
═══════════════════════════ */
const TL={
  glow:.6, neb:1.0, aurora:1.2, moon:1.7, moonFull:5.4,
  dstars:2.0, mstars:2.6, geo:2.7, mosque:3.4, parts:3.0,
  shoots:4.3, comets:7.0, lanterns:2.8, bunting:3.2,
  ar:5.5, orn:6.9, en:7.3, sub:8.6, ur:9.4, hint:10.8, fireworks:5.7,
};
let EL=0,lt=null,aph=0,cam=0;

/* ═══════════════════════════
   BUILD LANTERNS (8 total)
═══════════════════════════ */
const LD=[
  {w:36,h:52,c1:'#ff5500',c2:'#990e00',g:'rgba(255,80,0,'},
  {w:28,h:42,c1:'#ffd700',c2:'#b87800',g:'rgba(255,200,0,'},
  {w:40,h:58,c1:'#cc1a00',c2:'#780800',g:'rgba(200,30,0,'},
  {w:26,h:40,c1:'#22aa55',c2:'#0a5520',g:'rgba(30,175,80,'},
  {w:34,h:50,c1:'#7722cc',c2:'#380a66',g:'rgba(118,46,215,'},
  {w:30,h:46,c1:'#ff7700',c2:'#883300',g:'rgba(255,118,0,'},
  {w:24,h:38,c1:'#0088cc',c2:'#004488',g:'rgba(0,140,220,'},
  {w:32,h:48,c1:'#cc4400',c2:'#882200',g:'rgba(210,68,0,'},
];
const LDEL=['0s','-.95s','-1.75s','-2.35s','-1.15s','-1.95s','-.55s','-2.75s'];
(()=>{
  const row=document.getElementById('lrow');
  LD.forEach((d,i)=>{
    const lw=document.createElement('div');lw.className='lw';lw.style.animationDelay=LDEL[i];
    const ls=document.createElement('div');ls.className='ls';
    const lb=document.createElement('div');lb.className='lb';
    lb.style.cssText=`width:${d.w}px;height:${d.h}px;
      background:radial-gradient(ellipse at 34% 26%,${d.c1},${d.c2});
      box-shadow:0 0 12px 3px ${d.g}.55),0 0 26px 7px ${d.g}.2),
        inset 0 4px 8px rgba(255,255,200,.13),inset 0 -4px 10px rgba(0,0,0,.4);
      animation:lbGlow ${1.5+i*.12}s ease-in-out infinite alternate;
      animation-delay:${LDEL[i]};`;
    const sh=document.createElement('div');sh.className='lb-sh';
    const cr=document.createElement('div');cr.className='lb-cross';
    const gl=document.createElement('div');gl.className='lb-gl';
    gl.style.cssText=`background:radial-gradient(ellipse,${d.g}.44) 0%,transparent 66%);animation-delay:${LDEL[i]}`;
    lb.appendChild(sh);lb.appendChild(cr);lb.appendChild(gl);
    lw.appendChild(ls);lw.appendChild(lb);row.appendChild(lw);
  });
})();

/* ═══════════════════════════
   DEEP STARS — layer 0 (far)
═══════════════════════════ */
const DS_N=IS_LOW?120:IS_MOB?180:280;
const deepStars=Array.from({length:DS_N},()=>({
  nx:Math.random(),ny:Math.random()*.92,
  r:.12+Math.random()*.45,
  tw:Math.random()*Math.PI*2,spd:.005+Math.random()*.01,
  maxA:.15+Math.random()*.38,
  born:TL.dstars+Math.random()*7,pf:.14,
  col:Math.random()>.2?'200,215,255':'255,248,225',
}));

/* MID STARS — layer 1 */
const MS_N=IS_LOW?80:IS_MOB?130:220;
const midStars=Array.from({length:MS_N},()=>({
  nx:Math.random(),ny:Math.random()*.88,
  r:.25+Math.random()*.85,
  tw:Math.random()*Math.PI*2,spd:.007+Math.random()*.013,
  maxA:.35+Math.random()*.55,
  born:TL.mstars+Math.random()*5.5,pf:.5,
  cross:Math.random()>.68,
  col:Math.random()>.15?'255,252,228':Math.random()>.5?'200,222,255':'255,225,150',
}));

/* NEAR STARS — layer 2 (front, cross glints) */
const NS_N=IS_LOW?30:IS_MOB?50:90;
const nearStars=Array.from({length:NS_N},()=>({
  nx:Math.random(),ny:Math.random()*.82,
  r:.7+Math.random()*1.6,
  tw:Math.random()*Math.PI*2,spd:.009+Math.random()*.018,
  maxA:.7+Math.random()*.3,
  born:TL.mstars+Math.random()*4,pf:.9,cross:true,
  col:'255,252,228',
}));

/* ═══════════════════════════
   MILKY WAY BAND (drawn once on C1)
═══════════════════════════ */
let mwDrawn=false;
function drawMilkyWay(){
  if(mwDrawn)return;mwDrawn=true;
  const{ctx,W,H}=C1;
  // diagonal nebula band
  ctx.save();
  ctx.translate(W*.5,H*.5);ctx.rotate(-.35);
  const mw=ctx.createLinearGradient(-W*.8,-H*.15,-W*.8,H*.15);
  mw.addColorStop(0,'rgba(0,0,0,0)');

const partArr=[];
function n1d(x){// value noise
  const xi=Math.floor(x),xf=x-xi,u=xf*xf*(3-2*xf);
  const h1=((Math.sin(xi*127.1+31.7)*43758.5453)%1+1)%1;
  const h2=((Math.sin((xi+1)*127.1+31.7)*43758.5453)%1+1)%1;
  return h1*(1-u)+h2*u;
}
function mkP(active,ox,oy,burst){
  const a=Math.random()*Math.PI*2,sp=burst?(1.8+Math.random()*5.8):0;

}

/* ═══════════════════════════
   GEO CACHE
═══════════════════════════ */
let geoImg=null,geoW=0;
function buildGeo(W,H){
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;
  const g=oc.getContext('2d');
  const sz=Math.min(W,H)*(IS_MOB?.088:.066);
  g.strokeStyle='rgba(212,175,55,1)';g.lineWidth=IS_MOB?.82:.6;
  function s8(x,y,r){
    g.save();g.translate(x,y);g.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4,b=a+Math.PI/8,ir=r*.38;
      i===0?g.moveTo(Math.cos(a)*r,Math.sin(a)*r):g.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      g.lineTo(Math.cos(b)*ir,Math.sin(b)*ir);
    }
    g.closePath();g.stroke();
    g.beginPath();g.arc(0,0,r*.2,0,Math.PI*2);g.stroke();
    g.restore();
  }
  const step=sz*2.2;
  for(let y=-sz;y<H+sz*2;y+=step)for(let x=-sz;x<W+sz*2;x+=step)s8(x,y,sz*.82);
  return oc;
}

  // deep space gradient

  // nebula colored clouds (2-3 subtle blobs)

      {x:.18,y:.22,rx:.28,ry:.22,col:`rgba(40,20,80,`,a:.11},

      const ng=ctx.createRadialGradient(W*n.x,H*n.y,0,W*n.x,H*n.y,Math.min(W,H)*n.rx);
      ng.addColorStop(0,n.col+(np*n.a)+')');
      ng.addColorStop(.55,n.col+(np*n.a*.45)+')');
      ng.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);

      g.addColorStop(.62,b.c+(ap*.09)+')');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    });
    // warm gold horizon

    hg.addColorStop(0,'rgba(0,0,0,0)');
    hg.addColorStop(.45,`rgba(64,48,8,${ap*.09+Math.sin(aph*1.5)*.026})`);
    hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hg;ctx.fillRect(0,0,W,H);
    // top purple tint
    if(ap>.35){
      const tp=ctx.createLinearGradient(0,0,0,H*.28);
      tp.addColorStop(0,`rgba(22,8,42,${(ap-.35)*.13})`);tp.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=tp;ctx.fillRect(0,0,W,H);

  // center warmth
  if(EL>TL.glow){
    const gp=Math.min(1,(EL-TL.glow)/4.8);

/* ═══════════════════════════
   DRAW STAR LAYER
═══════════════════════════ */
function drawStarLayer(ctx,stars,W,H,haSize,crossOn){
  stars.forEach(s=>{
    if(EL<s.born)return;
    s.tw+=s.spd;
    const age=Math.min(1,(EL-s.born)/5.5);
    const alpha=age*s.maxA*(.32+Math.sin(s.tw)*.68);
    const ox=spx*-28*s.pf,oy=spy*-16*s.pf;
    const sx=((s.nx*W+ox)%W+W)%W;
    const sy=((s.ny*H+oy)%H+H)%H;
    const hr=s.r*haSize;
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,hr);
    g.addColorStop(0,`rgba(${s.col},${alpha*.56})`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,hr,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(${s.col},${alpha})`;
    ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);ctx.fill();
    if(crossOn&&s.cross&&alpha>.28){
      ctx.strokeStyle=`rgba(${s.col},${alpha*.46})`;ctx.lineWidth=.42;
      const gl=hr+2.2;
      ctx.beginPath();ctx.moveTo(sx-gl,sy);ctx.lineTo(sx+gl,sy);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx,sy-gl);ctx.lineTo(sx,sy+gl);ctx.stroke();
    }
  });
}

/* ═══════════════════════════
   DRAW: MOON (10-layer 3D)
═══════════════════════════ */
function drawMoon(p){
  if(p<=0)return;
  const{ctx,W,H}=C3;
  const camX=Math.sin(cam*.7)*.012+Math.sin(cam*.31)*.007;
  const camY=Math.cos(cam*.5)*.008+Math.cos(cam*.22)*.005;
  const R=Math.min(W,H)*(IS_MOB?.200:.166);
  const MX=W/2+camX*W*.04;
  const MY=H*(IS_MOB?.292:.268)+Math.sin(EL*.38)*(IS_MOB?4.5:7.5)+camY*H*.03;

  ctx.save();ctx.globalAlpha=Math.min(1,p*1.68);

  // L0: vast deep atmosphere
  const h0=ctx.createRadialGradient(MX,MY,R*.22,MX,MY,R*5.8);
  h0.addColorStop(0,'rgba(255,195,50,.24)');h0.addColorStop(.18,'rgba(175,138,20,.11)');
  h0.addColorStop(.48,'rgba(58,44,4,.032)');h0.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h0;ctx.beginPath();ctx.arc(MX,MY,R*5.8,0,Math.PI*2);ctx.fill();

  // L1: dual-frequency breathing corona
  const br=.86+Math.sin(EL*1.08)*.14+Math.sin(EL*2.3)*.05;
  const h1=ctx.createRadialGradient(MX,MY,R*.2,MX,MY,R*2.65*br);
  h1.addColorStop(0,'rgba(255,238,105,.50)');h1.addColorStop(.3,'rgba(212,175,55,.22)');
  h1.addColorStop(.68,'rgba(118,90,8,.07)');h1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h1;ctx.beginPath();ctx.arc(MX,MY,R*2.65*br,0,Math.PI*2);ctx.fill();

  // L2: inner warm glow
  const h2=ctx.createRadialGradient(MX,MY,R*.48,MX,MY,R*1.4);
  h2.addColorStop(0,'rgba(255,210,70,.32)');h2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h2;ctx.beginPath();ctx.arc(MX,MY,R*1.4,0,Math.PI*2);ctx.fill();

  // L3: moon disk - photo-real 3D lit top-left
  const disk=ctx.createRadialGradient(MX-R*.33,MY-R*.39,R*.016,MX,MY,R);
  disk.addColorStop(0,'#fffff2');disk.addColorStop(.08,'#fff3ac');
  disk.addColorStop(.22,'#ffd940');disk.addColorStop(.44,'#ecb200');
  disk.addColorStop(.64,'#b87c00');disk.addColorStop(.82,'#6c3c00');disk.addColorStop(1,'#180c00');
  ctx.shadowColor=`rgba(255,200,50,${.9*p})`;ctx.shadowBlur=70*p;
  ctx.fillStyle=disk;ctx.beginPath();ctx.arc(MX,MY,R,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;

  // L4: crescent dark mask
  const shift=R*.575;
  const cr=ctx.createRadialGradient(MX+shift-R*.042,MY-R*.054,R*.015,MX+shift,MY,R*1.12);
  cr.addColorStop(0,'rgba(0,1,10,.998)');cr.addColorStop(.43,'rgba(1,3,14,.980)');
  cr.addColorStop(.74,'rgba(3,5,18,.918)');cr.addColorStop(1,'rgba(5,7,22,0)');
  ctx.fillStyle=cr;ctx.beginPath();ctx.arc(MX+shift,MY,R*1.08,0,Math.PI*2);ctx.fill();

  // L5: depth inner shadow (subsurface scatter illusion)
  const ds=ctx.createRadialGradient(MX+R*.25,MY+R*.17,0,MX+R*.25,MY+R*.17,R*.64);
  ds.addColorStop(0,'rgba(0,0,0,.32)');ds.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ds;ctx.beginPath();ctx.arc(MX,MY,R,0,Math.PI*2);ctx.fill();

  // L6: rim back-light right
  const rim=ctx.createRadialGradient(MX+R*.84,MY,0,MX+R*.84,MY,R*.65);
  rim.addColorStop(0,'rgba(255,225,140,.30)');rim.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rim;ctx.beginPath();ctx.arc(MX,MY,R,0,Math.PI*2);ctx.fill();

  // L7: specular highlight top-left
  const sp=ctx.createRadialGradient(MX-R*.35,MY-R*.43,0,MX-R*.35,MY-R*.43,R*.45);
  sp.addColorStop(0,'rgba(255,255,252,.72)');sp.addColorStop(.36,'rgba(255,248,195,.28)');
  sp.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sp;ctx.beginPath();ctx.arc(MX,MY,R,0,Math.PI*2);ctx.fill();

  // L8: surface texture
  for(let si=0;si<6;si++){
    const sa=si*Math.PI*.32+.18;
    const g2=ctx.createLinearGradient(MX+Math.cos(sa)*R*.10,MY+Math.sin(sa)*R*.10,MX+Math.cos(sa)*R*.80,MY+Math.sin(sa)*R*.80);
    g2.addColorStop(0,'rgba(180,130,10,0)');g2.addColorStop(.5,`rgba(180,130,10,${p*.026})`);g2.addColorStop(1,'rgba(180,130,10,0)');
    ctx.strokeStyle=g2;ctx.lineWidth=R*.13;
    ctx.beginPath();ctx.moveTo(MX+Math.cos(sa)*R*.10,MY+Math.sin(sa)*R*.10);ctx.lineTo(MX+Math.cos(sa)*R*.80,MY+Math.sin(sa)*R*.80);ctx.stroke();
  }

  // L9: rotating light rays
  const rA=Math.min(1,p*1.55)*(p>.5?.15:.04);
  if(rA>0){
    const rN=IS_LOW?6:IS_MOB?9:13;
    for(let ri=0;ri<rN;ri++){
      const ang=ri*(Math.PI*2/rN)+EL*.011;
      ctx.save();ctx.translate(MX,MY);ctx.rotate(ang);
      const rl=ctx.createLinearGradient(0,0,R*5.5,0);
      rl.addColorStop(0,'rgba(255,222,70,.24)');rl.addColorStop(.36,'rgba(212,175,55,.09)');rl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=rA;ctx.fillStyle=rl;
      ctx.beginPath();ctx.moveTo(R*.85,-3.8);ctx.lineTo(R*5.5,-12);ctx.lineTo(R*5.5,12);ctx.lineTo(R*.85,3.8);
      ctx.closePath();ctx.fill();ctx.restore();
    }
    ctx.globalAlpha=Math.min(1,p*1.68);
  }

  // companion star
  const sx=MX+R*1.15,sy=MY-R*.80;
  const sa2=Math.min(1,(p-.40)*2.9)*(.5+Math.sin(EL*2.6)*.5);
  if(sa2>0){
    const sr=IS_MOB?10:15;
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
    sg.addColorStop(0,`rgba(255,248,200,${sa2})`);sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(255,244,188,${sa2*.8})`;ctx.lineWidth=.95;
    const cl=IS_MOB?13:21;
    [0,1,2,3].forEach(i=>{const a=i*Math.PI/2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*cl,sy+Math.sin(a)*cl);ctx.stroke();});
    ctx.lineWidth=.40;
    [1,3,5,7].forEach(i=>{const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*cl*.55,sy+Math.sin(a)*cl*.55);ctx.stroke();});
  }
  ctx.restore();
}

/* ═══════════════════════════
   STEP: PARTICLES
═══════════════════════════ */
function stepParts(){
  const{ctx,W,H}=C4;ctx.clearRect(0,0,W,H);
  while(partArr.length>PMAX+95)partArr.shift();
  partArr.forEach(p=>{
    if(EL<p.born)return;
    if(!p.active){p.active=true;p.x=Math.random()*W;p.y=H*.08+Math.random()*H*.86;}
    p.ns+=.008;
    const nx=(n1d(p.ns)*2-1)*.022,ny=(n1d(p.ns+55)*2-1)*.014;
    p.vx=(p.vx+nx+spx*-.030*p.r)*.995;p.vy=(p.vy+ny)*.995;
    p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.y<-15||p.life<=0||p.x<-15||p.x>W+15){
      p.x=Math.random()*W;p.y=H*.08+Math.random()*H*.86;
      p.life=1;p.vy=-(Math.random()*.26+.022);p.vx=(Math.random()-.5)*.12;p.ns=Math.random()*100;
    }
    const a=p.life*.6;
    const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*7.5);
    pg.addColorStop(0,`hsla(${p.hue},${p.sat}%,74%,${a*.28})`);pg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,p.r*7.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`hsla(${p.hue},${p.sat}%,88%,${a})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
}

/* ═══════════════════════════
   STEP: SHOOTS + COMETS + FW
═══════════════════════════ */
function stepFX(){
  const{ctx,W,H}=C5;ctx.clearRect(0,0,W,H);

  // shooting stars
  for(let i=shoots.length-1;i>=0;i--){
    const s=shoots[i];
    s.vy+=s.curl;s.x+=s.vx;s.y+=s.vy;s.life-=s.decay;s.ia=Math.min(1,s.ia+.065);
    if(s.life<=0){shoots.splice(i,1);continue;}
    const ang=Math.atan2(s.vy,s.vx);
    const tx=s.x-Math.cos(ang)*s.len,ty=s.y-Math.sin(ang)*s.len;
    const g=ctx.createLinearGradient(tx,ty,s.x,s.y);
    g.addColorStop(0,'rgba(255,248,220,0)');
    g.addColorStop(.44,`rgba(255,238,172,${s.life*s.ia*.28})`);
    g.addColorStop(.84,`rgba(255,252,220,${s.life*s.ia*.7})`);
    g.addColorStop(1,`rgba(255,255,255,${s.life*s.ia*.98})`);
    ctx.strokeStyle=g;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.stroke();
    const hg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,11);
    hg.addColorStop(0,`rgba(255,255,242,${s.life*s.ia})`);hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(s.x,s.y,11,0,Math.PI*2);ctx.fill();
    if(Math.random()>.65)partArr.push(mkP(true,s.x+(Math.random()*6-3),s.y+(Math.random()*6-3),false));
  }
  if(EL>nextSh&&Math.random()>.2){spawnShoot();nextSh=EL+2+Math.random()*5.5;}

  // comets (slow big ones)
  for(let i=comets.length-1;i>=0;i--){
    const c=comets[i];
    c.x+=c.vx;c.y+=c.vy;c.life-=c.decay;c.ia=Math.min(1,c.ia+.03);
    if(c.y>H+20||c.life<=0){comets.splice(i,1);continue;}
    const ang=Math.atan2(c.vy,c.vx);
    const tx=c.x-Math.cos(ang)*c.len,ty=c.y-Math.sin(ang)*c.len;
    const g=ctx.createLinearGradient(tx,ty,c.x,c.y);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(.5,`${c.col.replace(')',`,${c.life*c.ia*.2})`).replace('hsl','hsla')}`);
    g.addColorStop(1,`${c.col.replace(')',`,${c.life*c.ia*.7})`).replace('hsl','hsla')}`);
    ctx.strokeStyle=g;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(c.x,c.y);ctx.stroke();
    // comet head glow
    const cg=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,14);
    cg.addColorStop(0,`rgba(255,255,245,${c.life*c.ia*.8})`);cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(c.x,c.y,14,0,Math.PI*2);ctx.fill();
  }
  if(EL>nextCom&&Math.random()>.45){spawnComet();nextCom=EL+6+Math.random()*10;}

  // fireworks
  for(let i=fwArr.length-1;i>=0;i--){
    const f=fwArr[i];
    f.trail.push({x:f.x,y:f.y});if(f.trail.length>12)f.trail.shift();
    f.x+=f.vx;f.y+=f.vy;f.vy+=f.grav;f.vx*=.97;f.vy*=.97;f.life-=f.decay;
    if(f.life<=0){fwArr.splice(i,1);continue;}
    f.trail.forEach((pt,ti)=>{
      ctx.globalAlpha=(ti/f.trail.length)*f.life*.48;ctx.fillStyle=f.col;
      ctx.beginPath();ctx.arc(pt.x,pt.y,f.r*(ti/f.trail.length)*.65,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=f.life;ctx.fillStyle=f.col;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();
    const fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*5.5);
    fg.addColorStop(0,f.col);fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fg;ctx.globalAlpha=f.life*.30;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r*5.5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* ═══════════════════════════
   POST FX
═══════════════════════════ */
function drawPost(){
  const{ctx,W,H}=C6;ctx.clearRect(0,0,W,H);
  // vignette
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.26,W/2,H/2,Math.max(W,H)*.78);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(.52,'rgba(0,0,0,.10)');
  v.addColorStop(.80,'rgba(0,0,0,.34)');v.addColorStop(1,'rgba(0,0,0,.70)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  // letterbox
  const lb=H*.025;
  [[0,lb],[H-lb,lb]].forEach(([y,h])=>{
    const g=ctx.createLinearGradient(0,y,0,y+h*(y===0?1:-1)+h);
    g.addColorStop(0,'rgba(0,0,0,.28)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,y,W,h);
  });
  // warm center bloom
  if(EL>TL.moon){
    const mp=Math.min(1,(EL-TL.moon)/5.5);
    const bl=ctx.createRadialGradient(W/2,H*(IS_MOB?.29:.27),0,W/2,H*.4,Math.min(W,H)*.42);
    bl.addColorStop(0,`rgba(42,28,4,${mp*.05})`);bl.addColorStop(.4,`rgba(20,14,2,${mp*.018})`);bl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bl;ctx.fillRect(0,0,W,H);
  }
}

/* ═══════════════════════════
   REVEAL TIMELINE
═══════════════════════════ */
const seen={};let fwDone=false;
function checkReveals(){
  [['ar',TL.ar],['orn',TL.orn],['en',TL.en],['sub',TL.sub],
   ['ur',TL.ur],['hint',TL.hint],['lrow',TL.lanterns],['bunt',TL.bunting]
  ].forEach(([id,t])=>{
    if(!seen[id]&&EL>t){seen[id]=true;const el=document.getElementById(id);if(el)el.classList.add('on');}
  });
  if(!fwDone&&EL>TL.fireworks){fwDone=true;autoFW();}
}

function autoFW(){
  const W=C5.W,H=C5.H;
  const bursts=[
    [W*.20,H*.26,true],[W*.80,H*.22,true],[W*.50,H*.34,true],
    [W*.14,H*.45,false],[W*.86,H*.38,false],[W*.50,H*.18,true],
    [W*.34,H*.28,false],[W*.66,H*.24,false],[W*.28,H*.36,false],[W*.72,H*.30,false],
  ];
  bursts.forEach(([x,y,big],i)=>setTimeout(()=>{
    spawnFW(x,y,big);
    const fl=document.getElementById('flash');
    fl.classList.add('pop');setTimeout(()=>fl.classList.remove('pop'),100);
  },i*240));
  // third wave
  setTimeout(()=>{
    const n=IS_MOB?4:7;
    for(let k=0;k<n;k++)
      setTimeout(()=>spawnFW(W*(.08+Math.random()*.84),H*(.08+Math.random()*.46),Math.random()>.5),k*160);
  },2600);
}

/* ═══════════════════════════
   TAP / CLICK
═══════════════════════════ */
function tapAt(x,y){
  [0,1,2].forEach(i=>{
    const r=document.createElement('div');r.className='rip'+(i?' rip'+(i+1):'');
    const sz=Math.min(innerWidth,innerHeight)*(IS_MOB?.65:.55);
    r.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px`;
    document.body.appendChild(r);r.addEventListener('animationend',()=>r.remove());
  });
  spawnFW(x,y,false);
}
addEventListener('click',e=>tapAt(e.clientX,e.clientY));
addEventListener('touchstart',e=>tapAt(e.touches[0].clientX,e.touches[0].clientY),{passive:true});

/* ═══════════════════════════
   MAIN LOOP
═══════════════════════════ */
function frame(ts){
  if(!lt)lt=ts;
  const dt=Math.min((ts-lt)/1000,.05);
  lt=ts;EL+=dt;aph+=dt*.054;cam+=dt;
  spx+=(px-spx)*.045;spy+=(py-spy)*.045;

  // sky (full repaint each frame — aurora, warmth move)
  drawSky();

  // deep stars + milky way (C1 — milky way drawn once, stars update)
  if(!mwDrawn) drawMilkyWay();
  C1.ctx.clearRect(0,0,C1.W,C1.H);
  drawMilkyWay(); // no-op after first call
  drawStarLayer(C1.ctx,deepStars,C1.W,C1.H,3.5,false);

  // mid + near stars (C2)
  C2.ctx.clearRect(0,0,C2.W,C2.H);
  drawStarLayer(C2.ctx,midStars,C2.W,C2.H,5.5,true);
  drawStarLayer(C2.ctx,nearStars,C2.W,C2.H,6.2,true);

  // scene
  C3.ctx.clearRect(0,0,C3.W,C3.H);
  if(EL>TL.geo)    drawGeo(Math.min(1,(EL-TL.geo)/4.5));
  if(EL>TL.mosque) drawMosque(Math.min(1,(EL-TL.mosque)/6));
  if(EL>TL.moon){
    const mp=Math.min(1,(EL-TL.moon)/(TL.moonFull-TL.moon));
    drawMoon(mp<.5?2*mp*mp:1-Math.pow(-2*mp+2,2)/2);
  }

  // particles
  stepParts();

  // fx
  stepFX();

  // post
  drawPost();

  checkReveals();
  requestAnimationFrame(frame);
}

// fix milky way one-time draw
mwDrawn=false;
function drawMilkyWayOnce(){
  if(mwDrawn)return;mwDrawn=true;
  const{ctx,W,H}=C1;
  ctx.save();ctx.translate(W*.5,H*.5);ctx.rotate(-.35);
  const mw=ctx.createLinearGradient(-W*.8,-H*.15,-W*.8,H*.15);
  mw.addColorStop(0,'rgba(0,0,0,0)');mw.addColorStop(.3,'rgba(40,45,80,.055)');
  mw.addColorStop(.5,'rgba(60,65,120,.09)');mw.addColorStop(.7,'rgba(40,45,80,.055)');
  mw.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mw;ctx.fillRect(-C1.W,-H*.18,C1.W*2,H*.36);
  const n=IS_LOW?8:18;
  for(let i=0;i<n;i++){
    const cx=(Math.random()-.5)*C1.W*1.6,cy=(Math.random()-.5)*H*.3,r=20+Math.random()*60;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(80,90,160,.08)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// override frame's milky way logic
const _frame=frame;
function frame2(ts){
  if(!lt)lt=ts;
  const dt=Math.min((ts-lt)/1000,.05);
  lt=ts;EL+=dt;aph+=dt*.054;cam+=dt;
  spx+=(px-spx)*.045;spy+=(py-spy)*.045;

  drawSky();

  // milky way once + deep stars
  drawMilkyWayOnce();
  C1.ctx.clearRect(0,0,C1.W,C1.H);
  drawStarLayer(C1.ctx,deepStars,C1.W,C1.H,3.5,false);

  C2.ctx.clearRect(0,0,C2.W,C2.H);
  drawStarLayer(C2.ctx,midStars,C2.W,C2.H,5.5,true);
  drawStarLayer(C2.ctx,nearStars,C2.W,C2.H,6.2,true);

  C3.ctx.clearRect(0,0,C3.W,C3.H);
  if(EL>TL.geo)    drawGeo(Math.min(1,(EL-TL.geo)/4.5));
  if(EL>TL.mosque) drawMosque(Math.min(1,(EL-TL.mosque)/6));
  if(EL>TL.moon){
    const mp=Math.min(1,(EL-TL.moon)/(TL.moonFull-TL.moon));
    drawMoon(mp<.5?2*mp*mp:1-Math.pow(-2*mp+2,2)/2);
  }

  stepParts();
  stepFX();
  drawPost();
  checkReveals();
  requestAnimationFrame(frame2);
}
requestAnimationFrame(frame2);
</script>
