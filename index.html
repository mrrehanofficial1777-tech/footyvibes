<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<h1> Coming soon </h1>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6aff;
    --accent2: #ff6ab0;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --user-bubble: linear-gradient(135deg, #7c6aff, #b06aff);
    --bot-bubble: #1c1c28;
    --glow: rgba(124,106,255,0.15);
  }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(124,106,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(255,106,176,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
  }

  .logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--user-bubble);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 20px var(--glow);
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .header-text p {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background: #4ade80;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Chat container */
  .chat-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    height: 520px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
  }

  .chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-box::-webkit-scrollbar { width: 4px; }
  .chat-box::-webkit-scrollbar-track { background: transparent; }
  .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Messages */
  .message-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: fadeUp 0.3s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .avatar.bot-av { background: var(--surface2); border: 1px solid var(--border); }
  .avatar.user-av { background: var(--user-bubble); }

  .bubble {
    max-width: 75%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.6;
    word-break: break-word;
  }

  .bubble.bot {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .bubble.user {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    color: #fff;
    box-shadow: 0 4px 16px rgba(124,106,255,0.3);
  }

  /* Typing indicator */
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 0;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: dot 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Welcome message */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 10px;
    color: var(--text-muted);
    text-align: center;
    padding: 30px;
  }

  .welcome-icon {
    font-size: 36px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px var(--glow));
  }

  .welcome h2 {
    font-size: 16px;
    color: var(--text);
    font-weight: 500;
  }

  .welcome p {
    font-size: 12px;
    line-height: 1.6;
  }

  /* Input area */
  .input-area {
    padding: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface);
  }

  .input-wrapper {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    padding: 2px 4px 2px 14px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: rgba(124,106,255,0.4);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.08);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 13.5px;
    resize: none;
    padding: 9px 4px;
    max-height: 100px;
    line-height: 1.5;
    overflow-y: auto;
  }

  textarea::placeholder { color: var(--text-muted); }

  textarea::-webkit-scrollbar { width: 3px; }
  textarea::-webkit-scrollbar-thumb { background: var(--border); }

  .send-btn {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    border: none;
    background: var(--user-bubble);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(124,106,255,0.35);
  }

  .send-btn:hover { transform: scale(1.06); box-shadow: 0 6px 18px rgba(124,106,255,0.5); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .send-btn svg { width: 16px; height: 16px; fill: white; }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="logo">✦</div>
    <div class="header-text">
      <h1>AI Assistant</h1>
      <p><span class="status-dot"></span>online · powered by MR7 </p>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-box" id="chatBox">
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-icon">✦</div>
        <h2> ? ? ? </h2>
        <p> Coming Soon </p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="userInput" placeholder="Kuch bhi poocho..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="footer">MR7 · anthropic</div>
</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const welcomeScreen = document.getElementById('welcomeScreen');
  let conversationHistory = [];
  let isLoading = false;

  // Auto-resize textarea
  userInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });

  userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function removeWelcome() {
    if (welcomeScreen) welcomeScreen.remove();
  }

  function appendMessage(content, sender, isTyping = false) {
    const row = document.createElement('div');
    row.classList.add('message-row', sender);

    const avatar = document.createElement('div');
    avatar.classList.add('avatar', sender === 'user' ? 'user-av' : 'bot-av');
    avatar.textContent = sender === 'user' ? '👤' : '✦';

    const bubble = document.createElement('div');
    bubble.classList.add('bubble', sender === 'user' ? 'user' : 'bot');

    if (isTyping) {
      bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
    } else {
      bubble.textContent = content;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isLoading) return;

    removeWelcome();
    isLoading = true;
    sendBtn.disabled = true;

    appendMessage(text, 'user');
    userInput.value = '';
    userInput.style.height = 'auto';

    conversationHistory.push({ role: 'user', content: text });

    const typingBubble = appendMessage('', 'bot', true);

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'Aap ek helpful AI assistant hain. User ke saath friendly tone mein baat karein. Agar user Hindi mein pooche toh Hindi mein jawab dein, agar English mein pooche toh English mein.',
          messages: conversationHistory
        })
      });

      const data = await response.json();
      const reply = data.content?.[0]?.text || 'Kuch gadbad ho gayi. Dobara try karein.';

      conversationHistory.push({ role: 'assistant', content: reply });
      typingBubble.innerHTML = '';
      typingBubble.textContent = reply;

    } catch (err) {
      typingBubble.innerHTML = '';
      typingBubble.textContent = 'Coming soon 😅 sabar karoo';
      console.error(err);
    }

    isLoading = false;
    sendBtn.disabled = false;
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
