<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:'Segoe UI',sans-serif;
}

/* MULTI LAYER BACKGROUND */
.bg-layer{
    position:absolute;
    width:100%;
    height:100%;
}

.bg1{
    background: radial-gradient(circle at center, #0b0f3a, #000);
    animation: zoomSlow 20s infinite alternate ease-in-out;
}

.bg2{
    background: radial-gradient(circle at 30% 70%, rgba(255,215,0,0.08), transparent);
}

@keyframes zoomSlow{
    from{transform:scale(1)}
    to{transform:scale(1.3)}
}

/* STARS (3 LAYERS FOR DEPTH) */
.star{
    position:absolute;
    border-radius:50%;
}

.star.small{width:1px;height:1px;opacity:0.5}
.star.medium{width:2px;height:2px;opacity:0.7}
.star.large{width:3px;height:3px;opacity:1}

@keyframes twinkle{
    0%{opacity:0.2}
    50%{opacity:1}
    100%{opacity:0.3}
}

/* MOON (IMPROVED 3D LOOK) */
.moon{
    position:absolute;
    top:40%;
    left:50%;
    width:220px;
    height:220px;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0.5);
    background: radial-gradient(circle at 30% 30%, #fff, #ddd 50%, #aaa 80%);
    box-shadow:
        -60px 0 0 0 #000,
        0 0 60px rgba(255,255,200,0.8),
        0 0 140px rgba(255,215,0,0.5);
    opacity:0;
    animation: moonReveal 3s cubic-bezier(.25,.8,.25,1) forwards 2s;
}

@keyframes moonReveal{
    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* TEXT */
.text{
    position:absolute;
    top:62%;
    width:100%;
    text-align:center;
    font-size:64px;
    letter-spacing:6px;
    color:white;
    opacity:0;
    transform:translateY(40px) scale(0.8);
    text-shadow:
        0 0 20px #fff,
        0 0 50px gold,
        0 0 120px rgba(255,215,0,0.9);
    animation: textIn 3s ease forwards 3.5s, pulse 4s infinite 6s;
}

@keyframes textIn{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes pulse{
    0%,100%{text-shadow:0 0 20px #fff,0 0 50px gold}
    50%{text-shadow:0 0 40px #fff,0 0 120px gold}
}

/* SHIMMER EFFECT */
.text::after{
    content:"Eid Mubarak";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    background:linear-gradient(90deg, transparent, white, transparent);
    -webkit-background-clip:text;
    color:transparent;
    opacity:0;
    animation: shimmer 5s infinite 6s;
}

@keyframes shimmer{
    0%{opacity:0; transform:translateX(-100%)}
    50%{opacity:1}
    100%{opacity:0; transform:translateX(100%)}
}

/* PARTICLES */
.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:0.5;
    animation: float linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh)}
    to{transform:translateY(-10vh)}
}
</style>
</head>

<body>

<div class="bg-layer bg1"></div>
<div class="bg-layer bg2"></div>

<div class="moon"></div>
<div class="text">Eid Mubarak ✨</div>

<script>
// STARS GENERATOR (3 layers)
function createStars(count, type){
    for(let i=0;i<count;i++){
        let s=document.createElement("div");
        s.className="star "+type;
        s.style.left=Math.random()*100+"vw";
        s.style.top=Math.random()*100+"vh";
        s.style.animation="twinkle "+(2+Math.random()*4)+"s infinite";
        document.body.appendChild(s);
    }
}

createStars(80,"small");
createStars(50,"medium");
createStars(30,"large");

// PARTICLES
for(let i=0;i<50;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(6+Math.random()*10)+"s";
    document.body.appendChild(p);
}
</script>

</body>
</html>
