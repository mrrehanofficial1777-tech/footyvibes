<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eid Mubarak ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
/* ─────────────────────────────────────────
   ROOT TOKENS
───────────────────────────────────────── */
:root{
  --gold:#D4AF37;--gold2:#F5D76E;--gold3:#A0862A;
  --amber:#FF8C00;--cream:#FFF8E7;--deep:#03030F;
  --navy:#06091E;--teal:#0A2540;
  --glow:rgba(212,175,55,.55);
  --r:rgba(0,0,0,0);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--deep);font-family:'Cormorant Garamond',serif;cursor:none}

/* custom cursor */
#cursor{position:fixed;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.9),rgba(212,175,55,.1));
  pointer-events:none;z-index:9999;transform:translate(-50%,-50%);
  transition:transform .1s;mix-blend-mode:screen}
#cursor-trail{position:fixed;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(212,175,55,.3);pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);transition:left .18s ease,top .18s ease}

/* ─────────────────────────────────────────
   LAYERS
───────────────────────────────────────── */
#sky,#canvas-stars,#canvas-geo,#canvas-mosque,
#canvas-particles,#canvas-fx,#overlay-intro{
  position:fixed;inset:0;width:100%;height:100%}

/* sky gradient – animated from pitch-black to deep indigo */
#sky{
  background:radial-gradient(ellipse 80% 60% at 50% 0%,
    #0d1b3e 0%,#06091e 40%,#03030f 100%);
  z-index:0;
  animation:skyReveal 4s ease forwards}

@keyframes skyReveal{
  0%{opacity:0}
  100%{opacity:1}}

#canvas-stars{z-index:1}
#canvas-geo{z-index:2;opacity:.18}
#canvas-mosque{z-index:3;opacity:0;transition:opacity 3s ease}
#canvas-particles{z-index:4;pointer-events:none}
#canvas-fx{z-index:10;pointer-events:none}

/* intro cinematic overlay */
#overlay-intro{
  z-index:20;
  background:#000;
  animation:introFade 3s ease 0.5s forwards}
@keyframes introFade{0%{opacity:1}100%{opacity:0;pointer-events:none}}

/* ─────────────────────────────────────────
   MOON
───────────────────────────────────────── */
#moon-wrap{
  position:fixed;top:6vh;right:10vw;
  z-index:5;
  animation:moonRise 4s cubic-bezier(.22,.61,.36,1) 1s forwards,
            moonFloat 6s ease-in-out 5s infinite;
  opacity:0;transform:translateY(60px)}

@keyframes moonRise{
  0%{opacity:0;transform:translateY(80px)}
  100%{opacity:1;transform:translateY(0)}}
@keyframes moonFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-18px) rotate(2deg)}}

#moon{
  width:clamp(90px,12vw,150px);
  height:clamp(90px,12vw,150px);
  border-radius:50%;
  background:radial-gradient(circle at 38% 38%,
    #fffde7 0%,#ffe082 25%,#ffca28 50%,#ff8f00 75%,#e65100 100%);
  box-shadow:
    0 0 40px 10px rgba(255,200,50,.5),
    0 0 100px 30px rgba(255,150,0,.25),
    0 0 200px 60px rgba(255,100,0,.1),
    inset -20px -8px 0 rgba(180,120,0,.25);
  position:relative;overflow:hidden}

/* crescent mask */
#moon::after{
  content:'';position:absolute;
  top:-8%;left:18%;
  width:75%;height:75%;
  background:radial-gradient(circle,
    rgba(6,9,30,.95) 0%,rgba(6,9,30,.6) 60%,transparent 100%);
  border-radius:50%}

.moon-ray{
  position:absolute;top:50%;left:50%;
  width:200%;height:2px;
  background:linear-gradient(to right,transparent,rgba(255,220,100,.08),transparent);
  transform-origin:left center;border-radius:4px}

/* ─────────────────────────────────────────
   LANTERNS
───────────────────────────────────────── */
.lantern-container{position:fixed;top:0;left:0;right:0;z-index:6;pointer-events:none}
.lantern-wrap{display:inline-flex;flex-direction:column;align-items:center;position:absolute;top:0}

.string{width:1.5px;background:linear-gradient(to bottom,rgba(212,175,55,.7),rgba(212,175,55,.3));transform-origin:top}

.lantern{
  border-radius:45% 45% 55% 55%/38% 38% 62% 62%;
  position:relative;display:flex;align-items:center;justify-content:center}
.lantern::before{content:'';position:absolute;top:-14%;left:50%;transform:translateX(-50%);
  width:30%;height:20%;border-radius:4px 4px 0 0}
.lantern::after{content:'';position:absolute;bottom:-14%;left:50%;transform:translateX(-50%);
  width:20%;height:18%;border-radius:50%}
.lantern-inner{width:40%;height:60%;border-radius:50%;position:absolute;top:20%;left:30%;
  background:rgba(255,255,255,.15);filter:blur(4px)}

.lantern-glow{
  position:absolute;border-radius:50%;
  filter:blur(18px);z-index:-1;opacity:.7}

/* ─────────────────────────────────────────
   HERO CONTENT
───────────────────────────────────────── */
#hero{
  position:fixed;inset:0;z-index:7;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:20px;
  pointer-events:none}

.arabic-text{
  font-family:'Amiri',serif;
  font-size:clamp(2.8rem,9vw,7rem);
  color:var(--gold2);
  text-shadow:0 0 40px var(--glow),0 0 80px rgba(212,175,55,.3);
  line-height:1.1;letter-spacing:.04em;
  opacity:0;transform:scale(.88) translateY(20px);
  animation:heroIn 1.8s cubic-bezier(.16,1,.3,1) 3.2s forwards}

.en-text{
  font-family:'Cinzel Decorative',cursive;
  font-size:clamp(1.4rem,5vw,4rem);
  font-weight:700;
  letter-spacing:.2em;
  background:linear-gradient(135deg,var(--gold3),var(--gold),var(--gold2),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(212,175,55,.6));
  opacity:0;transform:scale(.9) translateY(16px);
  animation:heroIn 1.8s cubic-bezier(.16,1,.3,1) 3.8s forwards}

@keyframes heroIn{
  0%{opacity:0;transform:scale(.88) translateY(22px)}
  100%{opacity:1;transform:scale(1) translateY(0)}}

.divider-ornament{
  display:flex;align-items:center;gap:16px;margin:18px 0;
  opacity:0;animation:fadeSlide .9s ease 4.5s forwards}
@keyframes fadeSlide{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

.ornament-line{height:1px;width:clamp(60px,10vw,140px);
  background:linear-gradient(to right,transparent,var(--gold),transparent)}
.ornament-star{color:var(--gold);font-size:1.2rem;text-shadow:0 0 12px var(--glow)}

.tagline{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-weight:300;
  font-size:clamp(.9rem,2.5vw,1.4rem);
  color:rgba(255,248,231,.65);letter-spacing:.12em;
  opacity:0;animation:fadeSlide .9s ease 4.9s forwards}

/* ─────────────────────────────────────────
   CELEBRATE BUTTON
───────────────────────────────────────── */
#btn-celebrate{
  pointer-events:all;
  margin-top:clamp(28px,5vh,50px);
  padding:clamp(14px,2.5vh,20px) clamp(34px,6vw,64px);
  border:none;border-radius:60px;
  font-family:'Cinzel Decorative',cursive;
  font-size:clamp(.75rem,1.8vw,1.05rem);
  font-weight:700;letter-spacing:.18em;
  cursor:none;
  background:linear-gradient(135deg,#b8860b,var(--gold),#ffe066,var(--gold),#b8860b);
  background-size:300% 100%;
  color:#1a0f00;
  box-shadow:0 0 30px rgba(212,175,55,.45),0 4px 24px rgba(0,0,0,.5),
             inset 0 1px 0 rgba(255,255,255,.3);
  position:relative;overflow:hidden;
  opacity:0;transform:translateY(20px);
  animation:fadeSlide .9s ease 5.5s forwards,shimmerBg 3s linear 6s infinite;
  transition:transform .2s,box-shadow .2s}

@keyframes shimmerBg{
  0%{background-position:0% 50%}
  100%{background-position:300% 50%}}

#btn-celebrate::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);
  transform:translateX(-100%);transition:transform .5s}
#btn-celebrate:hover::before{transform:translateX(100%)}
#btn-celebrate:hover{transform:translateY(-3px) scale(1.03);
  box-shadow:0 0 60px rgba(212,175,55,.7),0 8px 30px rgba(0,0,0,.5),
             inset 0 1px 0 rgba(255,255,255,.4)}
#btn-celebrate:active{transform:scale(.97)}

/* ─────────────────────────────────────────
   WISHES PANEL
───────────────────────────────────────── */
#wishes-panel{
  position:fixed;inset:0;z-index:15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;background:rgba(3,3,15,.82);backdrop-filter:blur(18px);
  opacity:0;pointer-events:none;transition:opacity .7s ease}
#wishes-panel.open{opacity:1;pointer-events:all}

.panel-card{
  background:linear-gradient(155deg,rgba(16,22,52,.9),rgba(8,14,35,.95));
  border:1px solid rgba(212,175,55,.3);
  border-radius:24px;padding:40px 44px;
  max-width:560px;width:100%;
  box-shadow:0 0 60px rgba(212,175,55,.12),0 30px 80px rgba(0,0,0,.6);
  position:relative;overflow:hidden}

.panel-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(to right,transparent,var(--gold),transparent)}

.panel-title{
  font-family:'Cinzel Decorative',cursive;font-size:clamp(1rem,3vw,1.5rem);
  color:var(--gold2);letter-spacing:.15em;margin-bottom:8px;text-align:center}
.panel-subtitle{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(.85rem,2vw,1.05rem);color:rgba(255,248,231,.5);
  text-align:center;margin-bottom:28px;letter-spacing:.08em}

.panel-input{
  width:100%;padding:13px 20px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(212,175,55,.25);border-radius:12px;
  color:var(--cream);font-family:'Cormorant Garamond',serif;
  font-size:1.05rem;outline:none;letter-spacing:.04em;
  transition:border-color .3s,box-shadow .3s;margin-bottom:14px}
.panel-input:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(212,175,55,.18)}
.panel-input::placeholder{color:rgba(255,248,231,.3)}

.panel-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--gold3),var(--gold),var(--gold2));
  color:#1a0f00;font-family:'Cinzel Decorative',cursive;
  font-size:.85rem;font-weight:700;letter-spacing:.15em;cursor:none;
  transition:transform .2s,box-shadow .3s;margin-bottom:10px}
.panel-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,175,55,.4)}

.close-btn{
  position:absolute;top:16px;right:20px;background:none;border:none;
  color:rgba(212,175,55,.5);font-size:1.4rem;cursor:none;transition:color .2s}
.close-btn:hover{color:var(--gold)}

.cards-grid{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;max-height:180px;
  overflow-y:auto;padding-right:4px}
.cards-grid::-webkit-scrollbar{width:3px}
.cards-grid::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3);border-radius:4px}

.wish-chip{
  padding:8px 16px;border-radius:30px;
  background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);
  color:var(--cream);font-family:'Amiri',serif;font-size:.95rem;
  animation:chipIn .4s cubic-bezier(.175,.885,.32,1.275) forwards;
  opacity:0}
@keyframes chipIn{
  0%{opacity:0;transform:scale(0) rotate(-6deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}}

/* ─────────────────────────────────────────
   LIGHT RAYS
───────────────────────────────────────── */
#rays{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  opacity:0;transition:opacity 2s ease}
#rays.visible{opacity:1}
.ray{
  position:absolute;bottom:0;
  width:2px;height:100vh;
  background:linear-gradient(to top,transparent,rgba(212,175,55,.04),transparent);
  transform-origin:bottom center;filter:blur(8px)}

/* ─────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────── */
@media(max-width:600px){
  #moon-wrap{top:4vh;right:5vw}
  .panel-card{padding:28px 22px}
}
</style>
</head>
<body>

<!-- Custom cursor -->
<div id="cursor"></div>
<div id="cursor-trail"></div>

<!-- Cinematic black intro overlay -->
<div id="overlay-intro"></div>

<!-- Sky -->
<div id="sky"></div>

<!-- Canvases (back to front) -->
<canvas id="canvas-stars"></canvas>
<canvas id="canvas-geo"></canvas>
<canvas id="canvas-mosque"></canvas>
<canvas id="canvas-particles"></canvas>
<canvas id="canvas-fx"></canvas>

<!-- Light rays -->
<div id="rays">
  <div class="ray" style="left:10%;transform:rotate(-18deg)"></div>
  <div class="ray" style="left:22%;transform:rotate(-10deg)"></div>
  <div class="ray" style="left:38%;transform:rotate(-4deg)"></div>
  <div class="ray" style="left:50%;transform:rotate(0deg)"></div>
  <div class="ray" style="left:62%;transform:rotate(5deg)"></div>
  <div class="ray" style="left:75%;transform:rotate(11deg)"></div>
  <div class="ray" style="left:88%;transform:rotate(18deg)"></div>
</div>

<!-- Moon -->
<div id="moon-wrap">
  <div id="moon">
    <div class="moon-ray" style="transform:rotate(0deg)"></div>
    <div class="moon-ray" style="transform:rotate(30deg)"></div>
    <div class="moon-ray" style="transform:rotate(60deg)"></div>
    <div class="moon-ray" style="transform:rotate(90deg)"></div>
    <div class="moon-ray" style="transform:rotate(120deg)"></div>
    <div class="moon-ray" style="transform:rotate(150deg)"></div>
  </div>
</div>

<!-- Lantern container -->
<div class="lantern-container" id="lanterns"></div>

<!-- Hero -->
<div id="hero">
  <div class="arabic-text">عيد مبارك</div>
  <div class="divider-ornament">
    <div class="ornament-line"></div>
    <span class="ornament-star">✦ ☪ ✦</span>
    <div class="ornament-line" style="background:linear-gradient(to left,transparent,var(--gold),transparent)"></div>
  </div>
  <div class="en-text">EID MUBARAK</div>
  <div class="tagline">May peace, joy & blessings be upon you</div>
  <button id="btn-celebrate" onclick="celebrate()">✨ Celebrate Eid ✨</button>
</div>

<!-- Wishes Panel -->
<div id="wishes-panel">
  <div class="panel-card">
    <button class="close-btn" onclick="closePanel()">✕</button>
    <div class="panel-title">🌙 Send Your Wishes</div>
    <div class="panel-subtitle">Share the joy of Eid with your loved ones</div>
    <input class="panel-input" id="nameInput" placeholder="Your name..." maxlength="28"/>
    <input class="panel-input" id="msgInput" placeholder="Your Eid message... (optional)" maxlength="60"/>
    <button class="panel-btn" onclick="sendWish()">Send Eid Mubarak 🎊</button>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   CURSOR
══════════════════════════════════════════ */
const cur=document.getElementById('cursor'),trail=document.getElementById('cursor-trail');
let mx=0,my=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx+'px';cur.style.top=my+'px';
  setTimeout(()=>{trail.style.left=mx+'px';trail.style.top=my+'px'},80);
});

/* ══════════════════════════════════════════
   CANVAS SETUP HELPER
══════════════════════════════════════════ */
function setupCanvas(id){
  const c=document.getElementById(id),ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight}
  resize();window.addEventListener('resize',resize);
  return{c,ctx};
}

/* ══════════════════════════════════════════
   STARS  (parallax depth layers)
══════════════════════════════════════════ */
const{ctx:sctx}=setupCanvas('canvas-stars');
const starsC=document.getElementById('canvas-stars');
const STAR_COUNT=320;
const stars=[];
for(let i=0;i<STAR_COUNT;i++){
  stars.push({
    x:Math.random(),y:Math.random(),
    size:Math.random()*1.8+.3,
    speed:Math.random()*.4+.05,
    twinkle:Math.random()*Math.PI*2,
    layer:Math.floor(Math.random()*3), // 0=far,1=mid,2=near
    color:[
      `rgba(255,255,255,`,
      `rgba(255,240,200,`,
      `rgba(200,220,255,`,
    ][Math.floor(Math.random()*3)]
  });
}
// parallax offset
let mouseX=0,mouseY=0;
window.addEventListener('mousemove',e=>{mouseX=(e.clientX/innerWidth-.5);mouseY=(e.clientY/innerHeight-.5);});

function drawStars(){
  sctx.clearRect(0,0,starsC.width,starsC.height);
  const layerShift=[2,6,12];
  stars.forEach(s=>{
    s.twinkle+=.012;
    const alpha=.4+Math.sin(s.twinkle)*.45;
    const parallaxX=mouseX*layerShift[s.layer];
    const parallaxY=mouseY*layerShift[s.layer];
    const px=(s.x*starsC.width+parallaxX+starsC.width)%starsC.width;
    const py=(s.y*starsC.height+parallaxY+starsC.height)%starsC.height;
    sctx.beginPath();
    sctx.arc(px,py,s.size,0,Math.PI*2);
    sctx.fillStyle=s.color+alpha+')';
    sctx.fill();
    if(s.size>1.3){
      // soft star glow
      const g=sctx.createRadialGradient(px,py,0,px,py,s.size*4);
      g.addColorStop(0,s.color+alpha*.4+')');
      g.addColorStop(1,'transparent');
      sctx.fillStyle=g;
      sctx.beginPath();sctx.arc(px,py,s.size*4,0,Math.PI*2);sctx.fill();
    }
  });
}

/* ══════════════════════════════════════════
   ISLAMIC GEOMETRIC PATTERN
══════════════════════════════════════════ */
const{ctx:gctx}=setupCanvas('canvas-geo');
const geoC=document.getElementById('canvas-geo');
function drawGeo(){
  gctx.clearRect(0,0,geoC.width,geoC.height);
  const size=Math.min(geoC.width,geoC.height)*0.07;
  gctx.strokeStyle='rgba(212,175,55,0.55)';
  gctx.lineWidth=.7;
  // 8-pointed star tile
  for(let gy=-size;gy<geoC.height+size*2;gy+=size*2.3){
    for(let gx=-size;gx<geoC.width+size*2;gx+=size*2.3){
      draw8Star(gctx,gx,gy,size*.8);
    }
  }
}
function draw8Star(ctx,x,y,r){
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const angle=i*Math.PI/4;
    const innerR=r*.38;
    ctx.lineTo(Math.cos(angle)*r,Math.sin(angle)*r);
    ctx.lineTo(Math.cos(angle+Math.PI/8)*innerR,Math.sin(angle+Math.PI/8)*innerR);
  }
  ctx.closePath();ctx.stroke();
  // inner circle
  ctx.beginPath();ctx.arc(0,0,r*.22,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
window.addEventListener('resize',drawGeo);
drawGeo();

/* ══════════════════════════════════════════
   MOSQUE SILHOUETTE
══════════════════════════════════════════ */
const{ctx:mctx}=setupCanvas('canvas-mosque');
const mosC=document.getElementById('canvas-mosque');
function drawMosque(){
  const W=mosC.width,H=mosC.height;
  mctx.clearRect(0,0,W,H);
  const s=Math.min(W,H)/600;
  mctx.save();
  mctx.translate(W/2,H);
  mctx.scale(s,s);
  // golden gradient fill
  const grad=mctx.createLinearGradient(0,-400,0,0);
  grad.addColorStop(0,'rgba(212,175,55,0.22)');
  grad.addColorStop(.5,'rgba(180,130,20,0.12)');
  grad.addColorStop(1,'rgba(100,70,5,0.05)');
  mctx.fillStyle=grad;
  // main dome
  mctx.beginPath();
  mctx.arc(0,-260,110,Math.PI,0);
  mctx.lineTo(110,-180);mctx.lineTo(-110,-180);
  mctx.closePath();mctx.fill();
  // main body
  mctx.fillRect(-160,-180,320,180);
  // left minaret
  mctx.fillRect(-280,-340,40,340);
  mctx.beginPath();mctx.arc(-260,-340,22,Math.PI,0);mctx.fill();
  // right minaret
  mctx.fillRect(240,-340,40,340);
  mctx.beginPath();mctx.arc(260,-340,22,Math.PI,0);mctx.fill();
  // minaret caps (tiny domes)
  mctx.beginPath();mctx.arc(-260,-362,10,Math.PI,0);mctx.fill();
  mctx.beginPath();mctx.arc(260,-362,10,Math.PI,0);mctx.fill();
  // arch windows
  for(let wi=-1;wi<=1;wi++){
    const wx=wi*90;
    mctx.beginPath();
    mctx.rect(wx-20,-120,40,80);
    mctx.arc(wx,-120,20,Math.PI,0);
    mctx.fill();
  }
  mctx.restore();
}
window.addEventListener('resize',drawMosque);
drawMosque();
// Reveal mosque after intro
setTimeout(()=>{mosC.style.opacity='1'},3500);
// Rays reveal
setTimeout(()=>{document.getElementById('rays').classList.add('visible')},4000);

/* ══════════════════════════════════════════
   LANTERNS
══════════════════════════════════════════ */
const lanternData=[
  {left:'8%',h:90,w:55,color1:'#FF6B35',color2:'#C0392B',glowColor:'rgba(255,100,30,',delay:0,dur:3.2},
  {left:'22%',h:75,w:44,color1:'#FFD700',color2:'#E67E22',glowColor:'rgba(255,200,0,',delay:-1.2,dur:4},
  {left:'38%',h:95,w:58,color1:'#E74C3C',color2:'#8E1010',glowColor:'rgba(230,80,60,',delay:-.5,dur:3.6},
  {left:'55%',h:70,w:42,color1:'#27AE60',color2:'#1B5E20',glowColor:'rgba(40,180,100,',delay:-2,dur:2.9},
  {left:'70%',h:88,w:52,color1:'#9B59B6',color2:'#4A235A',glowColor:'rgba(150,80,200,',delay:-.8,dur:3.8},
  {left:'84%',h:80,w:48,color1:'#FF8C00',color2:'#8B4513',glowColor:'rgba(255,140,0,',delay:-1.5,dur:3.4},
];
const lanternContainer=document.getElementById('lanterns');
lanternData.forEach(d=>{
  const wrap=document.createElement('div');
  wrap.className='lantern-wrap';
  wrap.style.cssText=`left:${d.left};animation:lanternSway ${d.dur}s ease-in-out ${d.delay}s infinite`;
  const stringEl=document.createElement('div');
  stringEl.className='string';stringEl.style.height='clamp(50px,9vh,90px)';
  const lan=document.createElement('div');
  lan.className='lantern';
  lan.style.cssText=`
    width:${d.w}px;height:${d.h}px;
    background:radial-gradient(ellipse at 38% 32%,${d.color1},${d.color2});
    box-shadow:0 0 18px 4px ${d.glowColor}.65),0 0 40px 10px ${d.glowColor}.25);`;
  lan.style.animation=`lanternGlow ${d.dur*.8}s ease-in-out ${d.delay}s infinite alternate`;
  const inner=document.createElement('div');inner.className='lantern-inner';
  const glow=document.createElement('div');glow.className='lantern-glow';
  glow.style.cssText=`width:${d.w*1.8}px;height:${d.h*1.8}px;
    background:radial-gradient(ellipse,${d.glowColor}.4) 0%,transparent 70%);
    left:${-d.w*.4}px;top:${-d.h*.4}px`;
  lan.appendChild(inner);lan.appendChild(glow);
  lan.style.setProperty('--gc',d.glowColor);
  wrap.appendChild(stringEl);wrap.appendChild(lan);
  lanternContainer.appendChild(wrap);

// Inject keyframes dynamically
const kfStyle=document.createElement('style');
kfStyle.textContent=`
@keyframes lanternSway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes lanternGlow{
  from{box-shadow:0 0 14px 4px var(--gc,.55),0 0 30px 8px var(--gc,.2)}

`;
document.head.appendChild(kfStyle);

/* ══════════════════════════════════════════
   AMBIENT PARTICLES (floating sparkles)
══════════════════════════════════════════ */
const{ctx:pctx}=setupCanvas('canvas-particles');
const parC=document.getElementById('canvas-particles');
const PARTICLES=[];
const PAR_COUNT=80;
function spawnParticle(x,y,burst){
  const angle=Math.random()*Math.PI*2;
  const speed=burst?(2+Math.random()*5):(Math.random()*.6+.1);
  const size=burst?(2+Math.random()*4):(Math.random()*2+.5);
  PARTICLES.push({
    x:x??Math.random()*parC.width,
    y:y??parC.height+10,
    vx:Math.cos(angle)*speed*(burst?1:.3),
    vy:-Math.abs(Math.sin(angle)*speed)-(burst?0:.4),
    size,life:1,decay:burst?(.008+Math.random()*.015):(.003+Math.random()*.005),
    hue:40+Math.random()*30, // gold range
    burst:!!burst
  });
}
for(let i=0;i<PAR_COUNT;i++) spawnParticle();

function updateParticles(){
  pctx.clearRect(0,0,parC.width,parC.height);
  for(let i=PARTICLES.length-1;i>=0;i--){
    const p=PARTICLES[i];
    p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.y<-20||p.life<=0){
      PARTICLES.splice(i,1);
      if(!p.burst) spawnParticle();
      continue;
    }
    const a=p.burst?p.life:p.life*.7;
    // core
    pctx.beginPath();
    pctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    pctx.fillStyle=`hsla(${p.hue},90%,70%,${a})`;
    pctx.fill();
    // sparkle cross
    if(p.size>1){
      const gl=pctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*5);
      gl.addColorStop(0,`hsla(${p.hue},90%,75%,${a*.5})`);
      gl.addColorStop(1,'transparent');
      pctx.fillStyle=gl;
      pctx.beginPath();pctx.arc(p.x,p.y,p.size*5,0,Math.PI*2);pctx.fill();
    }
  }
}

/* ══════════════════════════════════════════
   FIREWORKS + CONFETTI (canvas-fx)
══════════════════════════════════════════ */
const{ctx:fctx}=setupCanvas('canvas-fx');
const fxC=document.getElementById('canvas-fx');
const FW=[],CONF=[];
const FW_COLORS=[
  '#FFD700','#FF6B35','#4ECDC4','#C0392B','#9B59B6',
  '#27AE60','#F39C12','#E74C3C','#3498DB','#FF8C00'
];
function launchFirework(x,y){
  const count=50+Math.floor(Math.random()*30);
  const hue=Math.floor(Math.random()*360);
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=2+Math.random()*5;
    FW.push({
      x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      life:1,decay:.012+Math.random()*.018,
      size:1.5+Math.random()*2.5,
      color:FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)],
      trail:[],gravity:.06
    });
    // spawn burst particles
    spawnParticle(x,y,true);
  }
}
function spawnConfetti(x,y){
  for(let i=0;i<8;i++){
    CONF.push({
      x,y,vx:(Math.random()-0.5)*8,vy:-(3+Math.random()*5),
      rot:Math.random()*360,rotV:(Math.random()-0.5)*8,
      w:6+Math.random()*8,h:4+Math.random()*5,
      color:FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)],
      life:1,decay:.008+Math.random()*.012
    });
  }
}

function updateFX(){
  fctx.clearRect(0,0,fxC.width,fxC.height);
  // fireworks
  for(let i=FW.length-1;i>=0;i--){
    const f=FW[i];
    f.trail.push({x:f.x,y:f.y,life:f.life});
    if(f.trail.length>8) f.trail.shift();
    f.x+=f.vx;f.y+=f.vy;f.vy+=f.gravity;f.vx*=.97;f.vy*=.97;
    f.life-=f.decay;
    if(f.life<=0){FW.splice(i,1);continue;}
    // trail
    f.trail.forEach((t,ti)=>{
      fctx.beginPath();
      fctx.arc(t.x,t.y,f.size*(ti/f.trail.length)*.6,0,Math.PI*2);
      fctx.fillStyle=f.color.replace(')',`,${t.life*.3})`).replace('rgb','rgba')
        .replace('#','').slice(0,3)==='NaN'?f.color:f.color;
      const alpha=(ti/f.trail.length)*f.life*.5;
      fctx.globalAlpha=alpha;fctx.fill();fctx.globalAlpha=1;
    });
    // core
    fctx.beginPath();fctx.arc(f.x,f.y,f.size,0,Math.PI*2);
    fctx.globalAlpha=f.life;fctx.fillStyle=f.color;fctx.fill();
    // glow
    const g=fctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.size*4);
    g.addColorStop(0,f.color);g.addColorStop(1,'transparent');
    fctx.fillStyle=g;fctx.globalAlpha=f.life*.3;
    fctx.beginPath();fctx.arc(f.x,f.y,f.size*4,0,Math.PI*2);fctx.fill();
    fctx.globalAlpha=1;
  }
  // confetti
  for(let i=CONF.length-1;i>=0;i--){
    const cf=CONF[i];
    cf.x+=cf.vx;cf.y+=cf.vy;cf.vy+=.15;cf.rot+=cf.rotV;cf.life-=cf.decay;
    if(cf.life<=0){CONF.splice(i,1);continue;}
    fctx.save();fctx.translate(cf.x,cf.y);fctx.rotate(cf.rot*Math.PI/180);
    fctx.globalAlpha=cf.life;fctx.fillStyle=cf.color;
    fctx.fillRect(-cf.w/2,-cf.h/2,cf.w,cf.h);
    fctx.restore();fctx.globalAlpha=1;
  }
}

/* ══════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════ */
function loop(){
  drawStars();
  updateParticles();
  updateFX();
  requestAnimationFrame(loop);
}
loop();

/* ══════════════════════════════════════════
   CELEBRATE  button
══════════════════════════════════════════ */
let celebrated=false;
function celebrate(){
  if(celebrated) return;
  celebrated=true;

  // 1. Multi-burst fireworks
  const burstPositions=[
    [.3,.3],[.7,.25],[.5,.4],[.2,.5],[.8,.45],
    [.4,.2],[.6,.35],[.5,.6],[.15,.35],[.85,.3]
  ];
  burstPositions.forEach(([rx,ry],i)=>{
    setTimeout(()=>{
      const x=fxC.width*rx,y=fxC.height*ry;
      launchFirework(x,y);
      for(let c=0;c<20;c++) spawnConfetti(x,y);
    },i*200);
  });

  // 2. Extra wave
  setTimeout(()=>{
    for(let i=0;i<6;i++)
      setTimeout(()=>launchFirework(
        fxC.width*(.1+Math.random()*.8),
        fxC.height*(.1+Math.random()*.5)
      ),i*180);
  },2200);

  // 3. Sound (soft celebratory chime synthesized)
  playCelebrationSound();

  // 4. Show panel
  setTimeout(()=>{
    document.getElementById('wishes-panel').classList.add('open');
  },800);

  // 5. Boost glow on moon
  document.getElementById('moon').style.boxShadow=
    '0 0 80px 25px rgba(255,200,50,.8),0 0 180px 60px rgba(255,150,0,.45),0 0 300px 100px rgba(255,100,0,.2),inset -20px -8px 0 rgba(180,120,0,.3)';

  // 6. Change button text
  const btn=document.getElementById('btn-celebrate');
  btn.style.opacity='.4';btn.style.transform='scale(.95)';
  btn.textContent='🎊 Eid Mubarak! 🎊';
}

/* ══════════════════════════════════════════
   WEB AUDIO: gentle celebratory chime
══════════════════════════════════════════ */
function playCelebrationSound(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const notes=[523.25,659.25,783.99,1046.5,1318.5]; // C5 E5 G5 C6 E6
    notes.forEach((freq,i)=>{
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      osc.connect(gain);gain.connect(ac.destination);
      osc.type='sine';osc.frequency.value=freq;
      const start=ac.currentTime+i*.18;
      gain.gain.setValueAtTime(0,start);
      gain.gain.linearRampToValueAtTime(.18,start+.05);
      gain.gain.exponentialRampToValueAtTime(.001,start+1.5);
      osc.start(start);osc.stop(start+1.5);
    });
    // second arpeggio
    const notes2=[784,988,1175,1568];
    notes2.forEach((freq,i)=>{
      const osc=ac.createOscillator();
      const gain=ac.createGain();
      osc.connect(gain);gain.connect(ac.destination);
      osc.type='triangle';osc.frequency.value=freq;
      const start=ac.currentTime+.9+i*.15;
      gain.gain.setValueAtTime(0,start);
      gain.gain.linearRampToValueAtTime(.1,start+.04);
      gain.gain.exponentialRampToValueAtTime(.001,start+1.2);
      osc.start(start);osc.stop(start+1.2);
    });
  }catch(e){}
}

/* ══════════════════════════════════════════
   WISHES PANEL
══════════════════════════════════════════ */
function closePanel(){
  document.getElementById('wishes-panel').classList.remove('open');
}
function sendWish(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name){document.getElementById('nameInput').focus();return;}
  const msg=document.getElementById('msgInput').value.trim();
  const grid=document.getElementById('cardsGrid');
  const chip=document.createElement('div');
  chip.className='wish-chip';
  chip.textContent=`🌙 ${name}${msg?' — '+msg:''}`;
  grid.appendChild(chip);
  document.getElementById('nameInput').value='';
  document.getElementById('msgInput').value='';
  // mini firework burst from button
  launchFirework(innerWidth/2,innerHeight*.6);
  for(let i=0;i<15;i++) spawnConfetti(innerWidth/2,innerHeight*.6);
}
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter') sendWish();});

/* ══════════════════════════════════════════
   CONTINUOUS AMBIENT FIREWORKS after celebrate
══════════════════════════════════════════ */
setInterval(()=>{
  if(celebrated && Math.random()>.55){
    launchFirework(fxC.width*(.1+Math.random()*.8),fxC.height*(.1+Math.random()*.45));
  }
},1800);

/* ══════════════════════════════════════════
   CLICK ANYWHERE = SPARKLES
══════════════════════════════════════════ */
document.addEventListener('click',e=>{
  if(e.target.closest('#wishes-panel')||e.target.closest('#btn-celebrate')) return;
  for(let i=0;i<18;i++) spawnParticle(e.clientX,e.clientY,true);
});
</script>
