<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at bottom, #020111 0%, #000000 100%);
    color: white;
    text-align: center;
}

/* Stars */
.stars {
    width: 100%;
    height: 100%;
    background: url('https://i.imgur.com/9QxZQZQ.png') repeat;
    animation: moveStars 60s linear infinite;
    position: absolute;
}
@keyframes moveStars {
    from {background-position: 0 0;}
    to {background-position: 10000px 5000px;}
}

/* Moon */
.moon {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #f5f3ce;
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 30px #fff;
    animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow {
    from { box-shadow: 0 0 20px #fff; }
    to { box-shadow: 0 0 60px #fff; }
}

/* Text */
h1 {
    position: absolute;
    top: 45%;
    width: 100%;
    font-size: 50px;
    letter-spacing: 3px;
    opacity: 0;
    animation: fadeIn 3s ease forwards 2s;
}
@keyframes fadeIn {
    to { opacity: 1; transform: scale(1.1); }
}

/* Button */
button {
    position: absolute;
    top: 65%;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 25px;
    border: none;
    background: gold;
    color: black;
    font-size: 18px;
    border-radius: 25px;
    cursor: pointer;
    opacity: 0;
    animation: fadeIn 2s ease forwards 4s;
}

/* Lanterns */
.lantern {
    position: absolute;
    width: 30px;
    height: 50px;
    background: gold;
    border-radius: 10px;
    animation: floatUp 10s linear infinite;
}
@keyframes floatUp {
    from { transform: translateY(100vh); }
    to { transform: translateY(-100vh); }
}

/* Fireworks */
.firework {
    position: absolute;
    width: 5px;
    height: 5px;
    background: red;
    border-radius: 50%;
    animation: explode 1s ease-out forwards;
}
@keyframes explode {
    to {
        transform: scale(20);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="moon"></div>

<h1>Eid Mubarak 🌙✨</h1>

<button onclick="celebrate()">Celebrate 🎉</button>

<script>
// Lanterns generate
for (let i = 0; i < 10; i++) {
    let lantern = document.createElement("div");
    lantern.className = "lantern";
    lantern.style.left = Math.random() * 100 + "vw";
    lantern.style.animationDuration = (5 + Math.random() * 10) + "s";
    document.body.appendChild(lantern);
}

// Fireworks function
function celebrate() {
    for (let i = 0; i < 30; i++) {
        let fw = document.createElement("div");
        fw.className = "firework";
        fw.style.left = Math.random() * window.innerWidth + "px";
        fw.style.top = Math.random() * window.innerHeight + "px";
        document.body.appendChild(fw);

        setTimeout(() => fw.remove(), 1000);
    }
}
</script>

</body>
</html>
