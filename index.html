<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Eid Mubarak ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
/* ════════════════════════════════════════════════
   RESET + BASE
════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
body{
  width:100%;height:100%;min-height:100vh;min-height:-webkit-fill-available;
  background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;
}

/* ════════════════════════════════════════════════
   CANVAS STACK
════════════════════════════════════════════════ */
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#c0{z-index:1}   /* deep sky + aurora + bg */
#c1{z-index:2}   /* stars */
#c2{z-index:3}   /* geo + mosque */
#c3{z-index:4}   /* moon */
#c4{z-index:5}   /* particles */
#c5{z-index:6;pointer-events:none} /* fx */
#c6{z-index:9;pointer-events:none} /* post-processing: vignette + bloom + grade */

/* ════════════════════════════════════════════════
   LANTERNS
════════════════════════════════════════════════ */
#lantern-row{
  position:fixed;top:0;left:0;right:0;
  z-index:7;pointer-events:none;
  display:flex;justify-content:space-around;
  padding:0 2vw;
  opacity:0;transition:opacity 2.4s cubic-bezier(.16,1,.3,1);
}
#lantern-row.show{opacity:1}
.ln-wrap{display:flex;flex-direction:column;align-items:center;transform-origin:top center}
.ln-string{
  width:1.5px;height:clamp(40px,7vh,82px);
  background:linear-gradient(to bottom,rgba(212,175,55,.85),rgba(212,175,55,.2));
  position:relative;
}
.ln-string::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:3px;height:100%;
  background:linear-gradient(to bottom,rgba(255,240,160,.4),transparent);
  filter:blur(1px);
}
.ln-body{
  border-radius:44% 44% 55% 55%/36% 36% 64% 64%;
  position:relative;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 8px var(--lc,rgba(255,140,0,.5)));
}
.ln-body::before{
  content:'';position:absolute;top:-14%;left:50%;transform:translateX(-50%);
  width:28%;height:18%;border-radius:4px 4px 0 0;
  background:linear-gradient(to bottom,#ffe080,#c8960a);
}
.ln-body::after{
  content:'';position:absolute;bottom:-15%;left:50%;transform:translateX(-50%);
  width:18%;height:18%;border-radius:50%;
  background:linear-gradient(to bottom,#ffe080,#c8960a);
}
.ln-shine{
  position:absolute;top:12%;left:18%;width:32%;height:52%;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.35),rgba(255,255,255,.05));
  filter:blur(2px);
}
.ln-cross{
  position:absolute;width:100%;height:100%;
  background:
    linear-gradient(to right,transparent 46%,rgba(255,255,200,.12) 50%,transparent 54%),
    linear-gradient(to bottom,transparent 46%,rgba(255,255,200,.12) 50%,transparent 54%);
}
.ln-glow{
  position:absolute;border-radius:50%;filter:blur(18px);z-index:-1;
  animation:lnGlowPulse 2s ease-in-out infinite alternate;
}
@keyframes lnGlowPulse{
  from{opacity:.45;transform:scale(.88)}
  to{opacity:.95;transform:scale(1.15)}
}
.sw1{animation:sway1 3.1s cubic-bezier(.45,0,.55,1) infinite}
.sw2{animation:sway2 3.9s cubic-bezier(.45,0,.55,1) infinite}
.sw3{animation:sway3 2.85s cubic-bezier(.45,0,.55,1) infinite}
.sw4{animation:sway4 4.25s cubic-bezier(.45,0,.55,1) infinite}
.sw5{animation:sway5 3.55s cubic-bezier(.45,0,.55,1) infinite}
.sw6{animation:sway6 3.35s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sway1{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes sway2{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-10deg)}}
@keyframes sway3{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(11deg)}}
@keyframes sway4{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-8deg)}}
@keyframes sway5{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(7deg)}}
@keyframes sway6{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-9deg)}}

/* bunting */
#bunting{
  position:fixed;top:0;left:0;right:0;z-index:7;
  height:clamp(50px,9vh,92px);pointer-events:none;
  opacity:0;transition:opacity 2.5s cubic-bezier(.16,1,.3,1) .5s;
}
#bunting.show{opacity:1}

/* ════════════════════════════════════════════════
   TEXT STAGE
════════════════════════════════════════════════ */
#stage{
  position:fixed;inset:0;z-index:8;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  pointer-events:none;
  padding-bottom:max(7vh,env(safe-area-inset-bottom,0px) + 6vh);
}

/* ── Arabic — embossed 3D gold ── */
#ar{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(3rem,11.5vw,7.8rem);
  line-height:1;letter-spacing:.04em;text-align:center;
  position:relative;
  /* layered paint: base gold + light stroke + shadow */
  background:linear-gradient(175deg,
    #fffff0 0%,#fff5a0 10%,#ffd84a 25%,#d4af37 45%,
    #ffe880 60%,#c07800 78%,#7a4a00 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  opacity:0;transform:translateY(44px) scale(.84) perspective(600px) rotateX(4deg);
  will-change:opacity,filter,transform;
  transition:
    opacity   4.2s cubic-bezier(.16,1,.3,1),
    filter    4.2s cubic-bezier(.16,1,.3,1),
    transform 4.2s cubic-bezier(.16,1,.3,1);
  filter:
    drop-shadow(0 1px 0px rgba(255,255,200,.9))
    drop-shadow(0 -1px 0px rgba(80,40,0,.8))
    drop-shadow(0 4px 12px rgba(0,0,0,.95))
    blur(24px);
}
#ar.show{
  opacity:1;
  transform:translateY(0) scale(1) perspective(600px) rotateX(0deg);
  filter:
    drop-shadow(0 1px 0px rgba(255,255,200,.95))
    drop-shadow(0 -1px 0px rgba(80,40,0,.9))
    drop-shadow(0 2px 3px rgba(120,80,0,.6))
    drop-shadow(0 0 40px rgba(212,175,55,.9))
    drop-shadow(0 0 100px rgba(212,175,55,.45))
    drop-shadow(0 8px 28px rgba(0,0,0,1))
    blur(0px);
  animation:arFloat 5.5s cubic-bezier(.45,0,.55,1) 4.5s infinite,
            arGlow  4s   ease-in-out               4.5s infinite;
}
@keyframes arFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-7px) scale(1.006)}
}
@keyframes arGlow{
  0%,100%{filter:
    drop-shadow(0 1px 0px rgba(255,255,200,.95))
    drop-shadow(0 -1px 0px rgba(80,40,0,.9))
    drop-shadow(0 2px 3px rgba(120,80,0,.6))
    drop-shadow(0 0 40px rgba(212,175,55,.9))
    drop-shadow(0 0 100px rgba(212,175,55,.45))
    drop-shadow(0 8px 28px rgba(0,0,0,1))}
  50%{filter:
    drop-shadow(0 1px 0px rgba(255,255,200,1))
    drop-shadow(0 -1px 0px rgba(80,40,0,.9))
    drop-shadow(0 2px 3px rgba(160,100,0,.7))
    drop-shadow(0 0 65px rgba(255,215,60,1))
    drop-shadow(0 0 150px rgba(212,175,55,.65))
    drop-shadow(0 8px 28px rgba(0,0,0,1))}
}

/* shine sweep on arabic */
#ar-shine{
  position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(105deg,
    transparent 0%,
    rgba(255,255,240,.0) 35%,
    rgba(255,255,240,.55) 50%,
    rgba(255,255,240,.0) 65%,
    transparent 100%);
  pointer-events:none;z-index:1;
  border-radius:inherit;
  opacity:0;
}
#ar.show #ar-shine{
  opacity:1;
  animation:shineSweep 5s cubic-bezier(.4,0,.6,1) 5s infinite;
}
@keyframes shineSweep{
  0%{left:-120%}60%,100%{left:160%}
}

/* ornament */
#orn{
  display:flex;align-items:center;gap:16px;
  margin:clamp(10px,2.2vh,20px) 0 clamp(8px,1.8vh,16px);
  opacity:0;transform:scaleX(.35);
  transition:opacity 2.4s cubic-bezier(.16,1,.3,1),
             transform 2.4s cubic-bezier(.34,1.56,.64,1);
}
#orn.show{opacity:1;transform:scaleX(1)}
.oline{
  height:1px;width:clamp(44px,9.5vw,135px);
  background:linear-gradient(to right,transparent,rgba(212,175,55,.8),transparent);
  position:relative;overflow:visible;
}
.oline::after{
  content:'';position:absolute;top:-1px;left:0;right:0;height:3px;
  background:inherit;filter:blur(3px);opacity:.6;
}
.oline.r{background:linear-gradient(to left,transparent,rgba(212,175,55,.8),transparent)}
.osym{
  font-size:clamp(.95rem,2.4vw,1.45rem);
  color:rgba(212,175,55,.92);
  white-space:nowrap;
  text-shadow:
    0 0 12px rgba(212,175,55,.9),
    0 0 30px rgba(212,175,55,.5),
    0 0 60px rgba(212,175,55,.25);
  animation:osymPulse 3.2s ease-in-out infinite 2s;
}
@keyframes osymPulse{
  0%,100%{text-shadow:0 0 12px rgba(212,175,55,.9),0 0 30px rgba(212,175,55,.5),0 0 60px rgba(212,175,55,.25)}
  50%{text-shadow:0 0 20px rgba(255,230,80,1),0 0 55px rgba(212,175,55,.8),0 0 110px rgba(212,175,55,.4)}
}

/* English — embossed luxury */
#en{
  font-family:'Cinzel Decorative',cursive;font-weight:700;
  font-size:clamp(1rem,4.5vw,3.3rem);
  letter-spacing:.28em;text-align:center;
  position:relative;
  background:linear-gradient(160deg,
    #fffff0 0%,#fff8c0 15%,#ffd84a 30%,
    #d4af37 50%,#fff8b8 68%,#c8880a 85%,#7a5000 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(24px) scale(.88);
  will-change:opacity,filter,transform;
  transition:
    opacity   3.6s cubic-bezier(.16,1,.3,1) .2s,
    filter    3.6s cubic-bezier(.16,1,.3,1) .2s,
    transform 3.6s cubic-bezier(.16,1,.3,1) .2s;
  filter:
    drop-shadow(0 1px 0px rgba(255,255,200,.8))
    drop-shadow(0 -1px 0px rgba(80,40,0,.7))
    drop-shadow(0 0 18px rgba(212,175,55,.6))
    blur(20px);
  padding-right:.28em;max-width:96vw;overflow:visible;
}
#en.show{
  opacity:1;transform:translateY(0) scale(1);
  filter:
    drop-shadow(0 1px 0px rgba(255,255,200,.9))
    drop-shadow(0 -1px 0px rgba(80,40,0,.8))
    drop-shadow(0 2px 4px rgba(100,60,0,.5))
    drop-shadow(0 0 35px rgba(212,175,55,.88))
    drop-shadow(0 0 90px rgba(212,175,55,.4))
    drop-shadow(0 6px 24px rgba(0,0,0,1))
    blur(0px);
  animation:enGlow 6s cubic-bezier(.45,0,.55,1) 4s infinite,
            enShine 7s cubic-bezier(.4,0,.6,1) 5s infinite;
}
@keyframes enGlow{
  0%,100%{filter:
    drop-shadow(0 1px 0px rgba(255,255,200,.9))
    drop-shadow(0 -1px 0px rgba(80,40,0,.8))
    drop-shadow(0 2px 4px rgba(100,60,0,.5))
    drop-shadow(0 0 35px rgba(212,175,55,.88))
    drop-shadow(0 0 90px rgba(212,175,55,.4))
    drop-shadow(0 6px 24px rgba(0,0,0,1)) blur(0px)}
  50%{filter:
    drop-shadow(0 1px 0px rgba(255,255,200,1))
    drop-shadow(0 -1px 0px rgba(80,40,0,.8))
    drop-shadow(0 2px 4px rgba(140,80,0,.6))
    drop-shadow(0 0 58px rgba(255,220,70,1))
    drop-shadow(0 0 130px rgba(212,175,55,.6))
    drop-shadow(0 6px 24px rgba(0,0,0,1)) blur(0px)}
}
/* English shine — pseudo overlay trick */
#en::after{
  content:attr(data-text);
  position:absolute;top:0;left:0;right:0;
  font-family:inherit;font-size:inherit;font-weight:inherit;
  letter-spacing:inherit;text-align:inherit;
  background:linear-gradient(105deg,
    transparent 0%,transparent 38%,
    rgba(255,255,240,.5) 50%,
    transparent 62%,transparent 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:300% 100%;background-position:200% 0;
  animation:none;pointer-events:none;
}
#en.show::after{
  animation:enShine 7s cubic-bezier(.4,0,.6,1) 5s infinite;
}
@keyframes enShine{
  0%,100%{background-position:200% 0}
  50%{background-position:-100% 0}
}

/* sub tagline */
#sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(.76rem,2.2vw,1.1rem);letter-spacing:.2em;text-align:center;
  color:rgba(255,240,180,0);
  margin-top:clamp(9px,1.8vh,18px);padding:0 16px;max-width:90vw;
  transition:color 3.8s cubic-bezier(.16,1,.3,1);
  text-shadow:0 0 28px rgba(212,175,55,.5),0 0 60px rgba(212,175,55,.2);
}
#sub.show{color:rgba(255,240,180,.58)}

/* urdu */
#ur{
  font-family:'Amiri',serif;
  font-size:clamp(.85rem,2.5vw,1.22rem);
  color:rgba(255,230,140,0);
  margin-top:clamp(6px,1.2vh,12px);letter-spacing:.06em;
  transition:color 3.8s cubic-bezier(.16,1,.3,1) .5s;
  text-shadow:0 0 22px rgba(212,175,55,.45);text-align:center;
}
#ur.show{color:rgba(255,230,140,.42)}

/* ════════════════════════════════════════════════
   BOTTOM HINT
════════════════════════════════════════════════ */
#hint{
  position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px) + 14px);
  left:50%;transform:translateX(-50%);
  z-index:10;pointer-events:none;
  opacity:0;transition:opacity 2.8s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;align-items:center;gap:8px;white-space:nowrap;
}
#hint.show{opacity:1}
.h-text{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(.62rem,.85vw,.78rem);letter-spacing:.32em;
  color:rgba(212,175,55,.42);
  text-shadow:0 0 20px rgba(212,175,55,.3);
}
.dot-row{display:flex;gap:9px;align-items:center}
.dp{
  width:3px;height:3px;border-radius:50%;background:rgba(212,175,55,.55);
  box-shadow:0 0 6px rgba(212,175,55,.5);
  animation:dpulse 2.8s cubic-bezier(.45,0,.55,1) infinite;
}
.dp:nth-child(2){animation-delay:.55s}.dp:nth-child(3){animation-delay:1.1s}
@keyframes dpulse{
  0%,100%{opacity:.22;transform:scale(1);box-shadow:0 0 4px rgba(212,175,55,.3)}
  50%{opacity:1;transform:scale(2.2);box-shadow:0 0 12px rgba(212,175,55,.8)}
}

/* ════════════════════════════════════════════════
   RIPPLE + FLASH
════════════════════════════════════════════════ */
.ripple{
  position:fixed;border-radius:50%;pointer-events:none;z-index:11;
  border:1px solid rgba(212,175,55,.6);
  transform:translate(-50%,-50%) scale(0);
  box-shadow:0 0 20px rgba(212,175,55,.25);
  animation:ripOut 1.4s cubic-bezier(.22,1,.36,1) forwards;
}
.ripple2{animation-delay:.18s;border-color:rgba(212,175,55,.28);border-width:1.5px}
@keyframes ripOut{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.85}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}
#flash{
  position:fixed;inset:0;z-index:20;pointer-events:none;
  background:rgba(255,220,80,.0);
  transition:background .08s;
}
#flash.pop{background:rgba(255,220,80,.15)}
</style>
</head>
<body>

<!-- Canvas stack -->
<canvas id="c0"></canvas>
<canvas id="c1"></canvas>
<canvas id="c2"></canvas>
<canvas id="c3"></canvas>
<canvas id="c4"></canvas>
<canvas id="c5"></canvas>
<canvas id="c6"></canvas><!-- post-fx -->

<!-- bunting SVG -->
<svg id="bunting" viewBox="0 0 1000 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-line">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0,10 Q125,72 250,22 Q375,72 500,16 Q625,72 750,22 Q875,72 1000,10"
    fill="none" stroke="rgba(212,175,55,.5)" stroke-width="1.3" filter="url(#glow-line)"/>
  <path d="M0,10 Q125,72 250,22 Q375,72 500,16 Q625,72 750,22 Q875,72 1000,10"
    fill="none" stroke="rgba(255,240,160,.2)" stroke-width="3"/>
</svg>

<!-- lanterns -->
<div id="lantern-row"></div>

<!-- text stage -->
<div id="stage">
  <div id="ar"><span id="ar-shine"></span>عيد مبارك</div>
  <div id="orn">
    <div class="oline"></div>
    <span class="osym">✦ ☪ ✦</span>
    <div class="oline r"></div>
  </div>
  <div id="en" data-text="EID MUBARAK">EID MUBARAK</div>
  <div id="sub">May peace, joy &amp; blessings fill your world</div>
  <div id="ur">خوشیاں اور برکتیں آپ کے ساتھ رہیں</div>
</div>

<div id="hint">
  <div class="h-text">✦ &nbsp; A L W A Y S &nbsp; B L E S S E D &nbsp; ✦</div>
  <div class="dot-row"><div class="dp"></div><div class="dp"></div><div class="dp"></div></div>
</div>
<div id="flash"></div>

<script>
'use strict';
/* ════════════════════════════════════════════
   DEVICE + PERF TIERS
════════════════════════════════════════════ */
const MOB  = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||innerWidth<768;
const LOW  = MOB && (navigator.hardwareConcurrency||4)<=4;
const TIER = LOW?0:MOB?1:2; // 0=low 1=mid 2=high

/* ════════════════════════════════════════════
   CANVAS FACTORY
════════════════════════════════════════════ */
function mkC(id,cap=2){
  const el=document.getElementById(id),ctx=el.getContext('2d');
  let W,H,dpr;
  const resize=()=>{
    dpr=Math.min(devicePixelRatio||1,TIER===0?1.5:TIER===1?1.8:cap);
    W=innerWidth;H=innerHeight;
    el.width=Math.round(W*dpr);el.height=Math.round(H*dpr);
    el.style.width=W+'px';el.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  resize();
  addEventListener('resize',resize);
  addEventListener('orientationchange',()=>setTimeout(resize,300));
  return{el,ctx,get W(){return W},get H(){return H}};
}
const C0=mkC('c0',1.5);
const C1=mkC('c1',1.5);
const C2=mkC('c2',1.5);
const C3=mkC('c3',2);
const C4=mkC('c4',1.5);
const C5=mkC('c5',1.5);
const C6=mkC('c6',1.5);

/* ════════════════════════════════════════════
   PARALLAX / POINTER INPUT
════════════════════════════════════════════ */
let rx=0,ry=0,srx=0,sry=0;
addEventListener('mousemove',e=>{rx=(e.clientX/innerWidth-.5)*2;ry=(e.clientY/innerHeight-.5)*2;});
addEventListener('touchmove',e=>{
  const tt=e.touches[0];
  rx=(tt.clientX/innerWidth-.5)*2;ry=(tt.clientY/innerHeight-.5)*2;
},{passive:true});
if(MOB&&window.DeviceOrientationEvent)
  addEventListener('deviceorientation',e=>{
    if(e.gamma!=null){rx=Math.max(-1,Math.min(1,e.gamma/28));ry=Math.max(-1,Math.min(1,(e.beta-30)/38));}
  },true);

/* ════════════════════════════════════════════
   TIMELINE
════════════════════════════════════════════ */
const T={
  glow:.7, aurora:1.3, moon:1.9, moonFull:5.6,
  stars:2.4, geo:2.9, mosque:3.8, part:3.4,
  shoot:4.8, lantern:3.3, bunting:3.8,
  ar:5.8, orn:7.2, en:7.6, sub:9.0, ur:9.8, hint:11.2,
  fireworks:6.0,
};
let T_=0,lt=null,aphase=0,camPhase=0;

/* ════════════════════════════════════════════
   CAMERA DRIFT  (micro, cinematic)
════════════════════════════════════════════ */
// very subtle sinusoidal drift — almost imperceptible but adds life
function camOffset(){
  return{
    x: Math.sin(camPhase*.7)*.012+Math.sin(camPhase*.31)*.007,
    y: Math.cos(camPhase*.5)*.008+Math.cos(camPhase*.22)*.005,
  };
}

/* ════════════════════════════════════════════
   LANTERNS BUILD
════════════════════════════════════════════ */
const LD=[
  {w:38,h:54,c1:'#ff5500',c2:'#991100',gc:'rgba(255,85,0,',  sw:'sw1',dl:'0s'},
  {w:32,h:46,c1:'#ffd700',c2:'#c07800',gc:'rgba(255,200,0,', sw:'sw2',dl:'-.8s'},

/* simple 1D value-noise for turbulence */
function vnoise(x){
  const xi=Math.floor(x),xf=x-xi;
  const h1=Math.sin(xi*127.1+31.7)*43758.5453;
  const h2=Math.sin((xi+1)*127.1+31.7)*43758.5453;
  const v1=h1-Math.floor(h1), v2=h2-Math.floor(h2);
  const u=xf*xf*(3-2*xf);
  return v1*(1-u)+v2*u;
}

   GEO CACHE
════════════════════════════════════════════ */
let geoCache=null,geoW=0;
function buildGeo(W,H){
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;
  const g=oc.getContext('2d');
  const sz=Math.min(W,H)*(MOB?.092:.07);
  g.strokeStyle='rgba(212,175,55,1)';g.lineWidth=MOB?.9:.65;
  function s8(x,y,r){
    g.save();g.translate(x,y);g.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4,b=a+Math.PI/8,ir=r*.38;
      i===0?g.moveTo(Math.cos(a)*r,Math.sin(a)*r):g.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      g.lineTo(Math.cos(b)*ir,Math.sin(b)*ir);
    }
    g.closePath();g.stroke();
    g.beginPath();g.arc(0,0,r*.2,0,Math.PI*2);g.stroke();
    g.restore();
  }
  const step=sz*2.25;
  for(let y=-sz;y<H+sz*2;y+=step)
    for(let x=-sz;x<W+sz*2;x+=step)
      s8(x,y,sz*.84);
  return oc;
}

/* ════════════════════════════════════════════
   MOON  — full cinematic 3D
════════════════════════════════════════════ */
function drawMoon(p){
  if(p<=0)return;
  const{ctx,W,H}=C3;
  const cam=camOffset();
  const R=Math.min(W,H)*(MOB?.198:.166);
  const MX=W/2+cam.x*W*.04;
  const baseY=H*(MOB?.292:.268);
  const fy=Math.sin(T_*.38)*(MOB?4.5:7.5);
  const MY=baseY+fy+cam.y*H*.03;

  ctx.save();ctx.globalAlpha=Math.min(1,p*1.65);

  // ── Layer 0: deep atmosphere (very wide) ──
  const h0=ctx.createRadialGradient(MX,MY,R*.25,MX,MY,R*5.6);
  h0.addColorStop(0,'rgba(255,195,50,.22)');
  h0.addColorStop(.2,'rgba(180,138,20,.10)');
  h0.addColorStop(.5,'rgba(60,44,4,.030)');
  h0.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h0;ctx.beginPath();ctx.arc(MX,MY,R*5.6,0,Math.PI*2);ctx.fill();

  // ── Layer 1: pulsing corona (breathing) ──
  const breathe=.88+Math.sin(T_*1.08)*.12+Math.sin(T_*2.3)*.04;
  const h1=ctx.createRadialGradient(MX,MY,R*.24,MX,MY,R*2.55*breathe);
  h1.addColorStop(0,'rgba(255,235,100,.45)');
  h1.addColorStop(.32,'rgba(212,175,55,.20)');
  h1.addColorStop(.70,'rgba(120,90,8,.06)');
  h1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h1;ctx.beginPath();ctx.arc(MX,MY,R*2.55*breathe,0,Math.PI*2);ctx.fill();

  // ── Layer 2: inner warm glow ──
  const h2=ctx.createRadialGradient(MX,MY,R*.5,MX,MY,R*1.38);
  h2.addColorStop(0,'rgba(255,210,70,.30)');h2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=h2;ctx.beginPath();ctx.arc(MX,MY,R*1.38,0,Math.PI*2);ctx.fill();

  // ── Layer 3: moon disk — photo-realistic 3D lit ──
  const disk=ctx.createRadialGradient(MX-R*.33,MY-R*.39,R*.018,MX,MY,R);
  disk.addColorStop(0,'#fffff0');
  disk.addColorStop(.09,'#fff2a8');
  disk.addColorStop(.24,'#ffd93c');
  disk.addColorStop(.46,'#eba800');
  disk.addColorStop(.66,'#b87800');
  disk.addColorStop(.83,'#6c3c00');
  disk.addColorStop(1,'#180c00');
  ctx.shadowColor=`rgba(255,200,50,${.85*p})`;
  ctx.shadowBlur=65*p;
  ctx.fillStyle=disk;ctx.beginPath();ctx.arc(MX,MY,R,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // ── Layer 4: crescent dark mask ──
  const shift=R*.575;
  const cr=ctx.createRadialGradient(MX+shift-R*.042,MY-R*.055,R*.018,MX+shift,MY,R*1.11);
  cr.addColorStop(0,'rgba(0,1,10,.998)');
  cr.addColorStop(.44,'rgba(1,3,14,.978)');
  cr.addColorStop(.75,'rgba(3,5,18,.915)');
  cr.addColorStop(1,'rgba(5,7,22,0)');
  ctx.fillStyle=cr;ctx.beginPath();ctx.arc(MX+shift,MY,R*1.07,0,Math.PI*2);ctx.fill();

  // ── Layer 5: depth inner shadow (SSS-like) ──
  const ds=ctx.createRadialGradient(MX+R*.24,MY+R*.16,0,MX+R*.24,MY+R*.16,R*.62);
  ds.addColorStop(0,'rgba(0,0,0,.30)');ds.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ds;ctx.beginPath();ctx.arc(MX,MY,R,0,Math.PI*2);ctx.fill();

  // ── Layer 6: rim back-light (right edge) ──
  const rim=ctx.createRadialGradient(MX+R*.84,MY,0,MX+R*.84,MY,R*.64);
  rim.addColorStop(0,'rgba(255,225,140,.28)');rim.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rim;ctx.beginPath();ctx.arc(MX,MY,R,0,Math.PI*2);ctx.fill();

  // ── Layer 7: specular highlight top-left ──
  const sp=ctx.createRadialGradient(MX-R*.34,MY-R*.42,0,MX-R*.34,MY-R*.42,R*.44);
  sp.addColorStop(0,'rgba(255,255,252,.70)');
  sp.addColorStop(.38,'rgba(255,248,195,.26)');
  sp.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sp;ctx.beginPath();ctx.arc(MX,MY,R,0,Math.PI*2);ctx.fill();

  // ── Layer 8: subtle surface texture ──
  for(let si=0;si<5;si++){
    const sa=si*Math.PI*.38+.2;
    const r0=R*.12,r1=R*.82;
    const sx1=MX+Math.cos(sa)*r0,sy1=MY+Math.sin(sa)*r0;
    const sx2=MX+Math.cos(sa)*r1,sy2=MY+Math.sin(sa)*r1;
    const sg2=ctx.createLinearGradient(sx1,sy1,sx2,sy2);
    sg2.addColorStop(0,'rgba(180,130,10,.0)');
    sg2.addColorStop(.5,`rgba(180,130,10,${p*.030})`);
    sg2.addColorStop(1,'rgba(180,130,10,.0)');
    ctx.strokeStyle=sg2;ctx.lineWidth=R*.14;
    ctx.beginPath();ctx.moveTo(sx1,sy1);ctx.lineTo(sx2,sy2);ctx.stroke();
  }

  // ── Layer 9: rotating light rays ──
  const rA=Math.min(1,p*1.5)*(p>.52?.14:.04);
  if(rA>0){
    const rN=TIER===0?8:12;
    for(let ri=0;ri<rN;ri++){
      const ang=ri*(Math.PI*2/rN)+T_*.012;
      ctx.save();ctx.translate(MX,MY);ctx.rotate(ang);
      const rl=ctx.createLinearGradient(0,0,R*5.2,0);
      rl.addColorStop(0,'rgba(255,222,70,.24)');
      rl.addColorStop(.38,'rgba(212,175,55,.09)');
      rl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=rA;ctx.fillStyle=rl;
      ctx.beginPath();
      ctx.moveTo(R*.86,-3.5);ctx.lineTo(R*5.2,-11);
      ctx.lineTo(R*5.2,11);ctx.lineTo(R*.86,3.5);
      ctx.closePath();ctx.fill();ctx.restore();
    }
    ctx.globalAlpha=Math.min(1,p*1.65);
  }

  // ── Companion star ──
  const sx=MX+R*1.15,sy=MY-R*.80;
  const sAge=Math.min(1,(p-.42)*2.8);
  if(sAge>0){
    const sa2=sAge*(.52+Math.sin(T_*2.5)*.48);
    const sr=MOB?10:14;
    const sg3=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
    sg3.addColorStop(0,`rgba(255,248,200,${sa2})`);sg3.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg3;ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(255,244,188,${sa2*.78})`;ctx.lineWidth=.95;
    const cl=MOB?13:20;
    [0,1,2,3].forEach(i=>{const a=i*Math.PI/2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*cl,sy+Math.sin(a)*cl);ctx.stroke();});
    ctx.lineWidth=.42;
    [1,3,5,7].forEach(i=>{const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*cl*.55,sy+Math.sin(a)*cl*.55);ctx.stroke();});
  }
  ctx.restore();
}

/* ════════════════════════════════════════════
   DRAW STARS  (depth-layered)
════════════════════════════════════════════ */
function drawStars(){
  const{ctx,W,H}=C1;
  STARS.forEach(s=>{
    if(T_<s.birth)return;
    s.tw+=s.spd;
    const age=Math.min(1,(T_-s.birth)/5);
    const alpha=age*s.maxA*(.36+Math.sin(s.tw)*.64);
    // parallax depth — farther layers move less
    const ox=srx*-24*s.pf, oy=sry*-14*s.pf;
    const px=((s.nx*W+ox)%W+W)%W;
    const py=((s.ny*H+oy)%H+H)%H;
    const col=SC_COL[s.color];
    // far-layer stars slightly blurred (depth softness)
    const blurAlpha=s.layer===0?alpha*.55:alpha;
    // glow halo — bigger on near stars
    const haloR=s.r*(s.layer===0?3.5:5.5);
    const sg=ctx.createRadialGradient(px,py,0,px,py,haloR);
    sg.addColorStop(0,`rgba(${col},${blurAlpha*.52})`);sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(px,py,haloR,0,Math.PI*2);ctx.fill();
    // core
    ctx.fillStyle=`rgba(${col},${blurAlpha})`;
    ctx.beginPath();ctx.arc(px,py,s.r*(s.layer===0?.7:1),0,Math.PI*2);ctx.fill();
    // cross glint (near stars only)
    if(s.cross&&alpha>.30){
      ctx.strokeStyle=`rgba(${col},${alpha*.52})`;ctx.lineWidth=.48;
      const gl=haloR+1.8;
      ctx.beginPath();ctx.moveTo(px-gl,py);ctx.lineTo(px+gl,py);ctx.stroke();
      ctx.beginPath();ctx.moveTo(px,py-gl);ctx.lineTo(px,py+gl);ctx.stroke();
    }
  });
}

/* ════════════════════════════════════════════
   SHOOTING STARS
════════════════════════════════════════════ */
function stepShoots(){
  const{ctx}=C5;
  for(let i=SHOOTS.length-1;i>=0;i--){
    const s=SHOOTS[i];
    // slight curve
    s.vy+=s.curve;
    s.x+=s.vx;s.y+=s.vy;s.life-=s.decay;s.ia=Math.min(1,s.ia+.065);
    if(s.life<=0){SHOOTS.splice(i,1);continue;}
    const ang=Math.atan2(s.vy,s.vx);
    const tx=s.x-Math.cos(ang)*s.len,ty=s.y-Math.sin(ang)*s.len;
    const g=ctx.createLinearGradient(tx,ty,s.x,s.y);
    g.addColorStop(0,'rgba(255,248,220,0)');
    g.addColorStop(.45,`rgba(255,238,172,${s.life*s.ia*.28})`);
    g.addColorStop(.85,`rgba(255,252,220,${s.life*s.ia*.7})`);
    g.addColorStop(1,`rgba(255,255,255,${s.life*s.ia*.98})`);
    ctx.strokeStyle=g;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.stroke();
    // head glow
    const hg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,11);
    hg.addColorStop(0,`rgba(255,255,245,${s.life*s.ia})`);hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(s.x,s.y,11,0,Math.PI*2);ctx.fill();
    // mini trail particles
    if(Math.random()>.6&&TIER>0){
      PARTS.push(mkP(true,s.x+Math.random()*6-3,s.y+Math.random()*6-3,false));
    }
  }
  if(T_>nextSh&&Math.random()>.22){spawnShoot();nextSh=T_+2.2+Math.random()*5.8;}
}

/* ════════════════════════════════════════════
   FIREWORKS
════════════════════════════════════════════ */
function stepFW(){
  const{ctx}=C5;
  for(let i=FW.length-1;i>=0;i--){
    const f=FW[i];
    f.trail.push({x:f.x,y:f.y,l:f.life});
    if(f.trail.length>10)f.trail.shift();
    f.x+=f.vx;f.y+=f.vy;f.vy+=f.grav;f.vx*=.97;f.vy*=.97;
    f.life-=f.decay;
    if(f.life<=0){FW.splice(i,1);continue;}
    // trail with fade
    f.trail.forEach((pt,ti)=>{
      const ta=(ti/f.trail.length);
      ctx.globalAlpha=ta*f.life*.45;
      ctx.fillStyle=f.col;
      ctx.beginPath();ctx.arc(pt.x,pt.y,f.r*ta*.6,0,Math.PI*2);ctx.fill();
    });
    // head
    ctx.globalAlpha=f.life;ctx.fillStyle=f.col;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();
    // glow
    const fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*5);
    fg.addColorStop(0,f.col);fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fg;ctx.globalAlpha=f.life*.32;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r*5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* ════════════════════════════════════════════
   PARTICLES  — organic turbulence
════════════════════════════════════════════ */
function stepParts(){
  const{ctx,W,H}=C4;
  while(PARTS.length>PMAX+90)PARTS.shift();
  PARTS.forEach(p=>{
    if(T_<p.birth)return;
    if(!p.active){p.active=true;p.x=Math.random()*W;p.y=H*.1+Math.random()*H*.85;}
    // turbulence: noise-based acceleration
    p.noise+=.008;
    const nx=(vnoise(p.noise)*2-1)*.025;
    const ny=(vnoise(p.noise+50)*2-1)*.015;
    p.vx+=nx+srx*-.035*p.r;
    p.vy+=ny;
    // drag
    p.vx*=.994;p.vy*=.994;
    p.x+=p.vx;p.y+=p.vy;
    p.life-=p.decay;
    if(p.y<-16||p.life<=0||p.x<-16||p.x>W+16){
      p.x=Math.random()*W;p.y=H*.08+Math.random()*H*.88;
      p.life=1;p.vy=-(Math.random()*.28+.025);p.vx=(Math.random()-.5)*.14;p.noise=Math.random()*100;
    }
    const a=p.life*.62;
    // soft aura
    const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*7);
    pg.addColorStop(0,`hsla(${p.hue},${p.sat}%,74%,${a*.28})`);
    pg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,p.r*7,0,Math.PI*2);ctx.fill();
    // core
    ctx.fillStyle=`hsla(${p.hue},${p.sat}%,88%,${a})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
}

/* ════════════════════════════════════════════
   POST-PROCESSING  (c6)
   Vignette + cinematic grade + bloom
════════════════════════════════════════════ */
function drawPostFX(){
  const{ctx,W,H}=C6;
  ctx.clearRect(0,0,W,H);

  // ── VIGNETTE (dark edges, bright center) ──
  const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.28,W/2,H/2,Math.max(W,H)*.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(.55,'rgba(0,0,0,.12)');
  vig.addColorStop(.82,'rgba(0,0,0,.38)');
  vig.addColorStop(1,'rgba(0,0,0,.72)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

  // ── CINEMATIC LETTERBOX (ultra-subtle) ──
  // top/bottom thin fade-to-black — film grade look
  const lbH=H*.028;
  [0,H-lbH].forEach(y=>{
    const g=ctx.createLinearGradient(0,y,0,y+lbH*(y===0?1:-1)+lbH);
    g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,y,W,lbH);
  });

  // ── CINEMATIC COLOR GRADE overlay ──
  // Warm gold tint in center, cool at edges
  const grade=ctx.createRadialGradient(W*.5,H*.4,0,W*.5,H*.5,Math.max(W,H)*.65);
  grade.addColorStop(0,`rgba(40,28,4,${.06+Math.sin(T_*.18)*.02})`);
  grade.addColorStop(.5,'rgba(0,0,0,0)');
  grade.addColorStop(1,`rgba(4,6,18,${.08+Math.cos(T_*.14)*.02})`);
  ctx.fillStyle=grade;ctx.fillRect(0,0,W,H);

  // ── BLOOM / GLOW PASS on moon area ──
  // soft white center-top bloom
  if(T_>T.moon){
    const mp=Math.min(1,(T_-T.moon)/4);
    const bloomY=H*(MOB?.292:.268);
    const bl=ctx.createRadialGradient(W/2,bloomY,0,W/2,bloomY,Math.min(W,H)*.38);
    bl.addColorStop(0,`rgba(255,240,180,${mp*.06})`);
    bl.addColorStop(.4,`rgba(212,175,55,${mp*.025})`);
    bl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bl;ctx.fillRect(0,0,W,H);
  }

  // ── CHROMATIC ABERRATION hint (top corners, barely visible) ──
  if(TIER>0){
    const ca=ctx.createRadialGradient(0,0,0,0,0,Math.min(W,H)*.25);
    ca.addColorStop(0,'rgba(255,0,0,.018)');ca.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ca;ctx.fillRect(0,0,W*.3,H*.3);
    const ca2=ctx.createRadialGradient(W,0,0,W,0,Math.min(W,H)*.25);
    ca2.addColorStop(0,'rgba(0,0,255,.018)');ca2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ca2;ctx.fillRect(W*.7,0,W*.3,H*.3);
  }

  // ── FILM GRAIN (subtle static) ──
  if(TIER===2){
    const grain=ctx.createImageData(W,H);
    const gd=grain.data;
    for(let i=0;i<gd.length;i+=4){
      const v=(Math.random()*.5-.25)*18|0;
      gd[i]=gd[i+1]=gd[i+2]=128+v;gd[i+3]=8;
    }
    ctx.putImageData(grain,0,0);
  }
}

/* ════════════════════════════════════════════
   TEXT REVEALS
════════════════════════════════════════════ */
const shown={};let fwDone=false;
function checkText(){
  [['ar',T.ar],['orn',T.orn],['en',T.en],['sub',T.sub],['ur',T.ur],['hint',T.hint],
   ['lantern-row',T.lantern],['bunting',T.bunting]
  ].forEach(([id,ts])=>{
    if(!shown[id]&&T_>ts){
      shown[id]=true;
      const el=document.getElementById(id);if(el)el.classList.add('show');
    }
  });
  if(!fwDone&&T_>T.fireworks){fwDone=true;autoFireworks();}
}

function autoFireworks(){
  const W=C5.W,H=C5.H;
  const bursts=[[W*.2,H*.26],[W*.8,H*.23],[W*.5,H*.36],
                [W*.15,H*.46],[W*.85,H*.39],[W*.5,H*.19],[W*.35,H*.28],[W*.65,H*.25]];
  bursts.forEach(([x,y],i)=>setTimeout(()=>{
    spawnFW(x,y);
    const fl=document.getElementById('flash');
    fl.classList.add('pop');setTimeout(()=>fl.classList.remove('pop'),120);
    for(let j=0;j<(MOB?14:24);j++) PARTS.push(mkP(true,x,y,true));
  },i*260));
  setTimeout(()=>{
    for(let k=0;k<(MOB?4:6);k++)
      setTimeout(()=>spawnFW(W*(.08+Math.random()*.84),H*(.08+Math.random()*.48)),k*180);
  },2400);
}

/* ════════════════════════════════════════════
   TAP / CLICK
════════════════════════════════════════════ */
function tapAt(x,y){
  [0,1].forEach(i=>{
    const r=document.createElement('div');
    r.className='ripple'+(i?' ripple2':'');
    const sz=Math.min(innerWidth,innerHeight)*(MOB?.62:.52);
    r.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px`;
    document.body.appendChild(r);
    r.addEventListener('animationend',()=>r.remove());
  });
  spawnFW(x,y);
  for(let i=0;i<(MOB?18:28);i++) PARTS.push(mkP(true,x,y,true));
}
addEventListener('click',e=>tapAt(e.clientX,e.clientY));
addEventListener('touchstart',e=>{
  const tt=e.touches[0];tapAt(tt.clientX,tt.clientY);
},{passive:true});

/* ════════════════════════════════════════════
   MAIN LOOP
════════════════════════════════════════════ */
function frame(ts){
  if(!lt)lt=ts;
  const dt=Math.min((ts-lt)/1000,.05);
  lt=ts;T_+=dt;aphase+=dt*.055;camPhase+=dt;

  // smooth lerp parallax (cinematic ease)
  srx+=(rx-srx)*.045;sry+=(ry-sry)*.045;

  const{ctx:bg,W,H}=C0;

  /* ── BG sky ── */
  const bA=Math.min(1,Math.max(0,(T_-T.glow)/3.0));
  const cam=camOffset();
  const bCX=W/2+(srx*W*.06)+(cam.x*W*.015);
  const bCY=H/2+(sry*H*.04)+(cam.y*H*.01);
  const bgG=bg.createRadialGradient(bCX,bCY*.34,0,bCX,H*.52,Math.max(W,H)*.97);
  bgG.addColorStop(0,`rgba(16,20,52,${bA})`);bgG.addColorStop(.2,`rgba(10,13,36,${bA})`);
  bgG.addColorStop(.5,`rgba(6,8,22,${bA*.95})`);bgG.addColorStop(1,'rgba(0,0,0,1)');
  bg.fillStyle=bgG;bg.fillRect(0,0,W,H);

  /* aurora */
  if(T_>T.aurora) drawAurora(Math.min(1,(T_-T.aurora)/4.2),bg,W,H);

  /* center warmth */
  if(T_>T.glow){
    const gp=Math.min(1,(T_-T.glow)/4.2);
    const cg=bg.createRadialGradient(W/2,H*.29,0,W/2,H*.37,Math.min(W,H)*.60);
    cg.addColorStop(0,`rgba(55,44,12,${gp*.26})`);cg.addColorStop(.4,`rgba(25,18,4,${gp*.10})`);
    cg.addColorStop(1,'rgba(0,0,0,0)');
    bg.fillStyle=cg;bg.fillRect(0,0,W,H);
  }

  /* haze */
  drawHaze(bg,W,H,Math.min(1,(T_-T.glow)/5));

  /* stars */
  C1.ctx.clearRect(0,0,C1.W,C1.H);
  drawStars();

  /* geo + mosque */
  C2.ctx.clearRect(0,0,C2.W,C2.H);
  if(T_>T.geo){
    if(!geoCache||geoW!==C2.W){geoCache=buildGeo(C2.W,C2.H);geoW=C2.W;}
    const gp2=Math.min(1,(T_-T.geo)/3.8);
    C2.ctx.globalAlpha=gp2*.105;C2.ctx.drawImage(geoCache,0,0,C2.W,C2.H);C2.ctx.globalAlpha=1;
  }
  if(T_>T.mosque) drawMosque(Math.min(1,(T_-T.mosque)/5.8));

  /* moon */
  C3.ctx.clearRect(0,0,C3.W,C3.H);
  if(T_>T.moon){
    const mp=Math.min(1,(T_-T.moon)/(T.moonFull-T.moon));
    drawMoon(mp<.5?2*mp*mp:1-Math.pow(-2*mp+2,2)/2);
  }

  /* particles */
  C4.ctx.clearRect(0,0,C4.W,C4.H);
  stepParts();

  /* fx */
  C5.ctx.clearRect(0,0,C5.W,C5.H);
  stepShoots();
  stepFW();

  /* post-fx: vignette + grade + bloom (every frame) */
  drawPostFX();

  checkText();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
